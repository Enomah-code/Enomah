[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "raphael"
version = "1.0.0"
description = "Raphaël - Réseau d'agents IA ultra-puissant interconnecté et auto-évolutif"
authors = [
    {name = "Raphaël AI Network"}
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]
include = ["raphael*"]

[project.scripts]
raphael = "main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
