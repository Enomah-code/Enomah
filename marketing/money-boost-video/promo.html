<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}#c{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script>
// ===========================================================================
// Money Boost 2026 — animated advertising video (deterministic; window.seek(t)).
// Cinematic motion graphics: camera moves, scene transitions, an animated
// character (worried -> fulfilled), kinetic word-by-word captions, particles,
// flying coins, light rays. render.js screenshots each frame.
// ===========================================================================
const W=1080, H=1920;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
window.TIMELINE=window.TIMELINE||[]; window.DURATION=window.DURATION||68;

const LINES=[
  "2027, c'est dans\nquelques mois.",                 // 0
  "Qu'as-tu changé\ndans ta vie ?",                   // 1
  "Tu te poses la question\nchaque année.",            // 2
  "Et chaque année…\nle même endroit.",                // 3
  "À attendre une chance\nqui ne vient pas.",          // 4
  "Tu as le téléphone.",                               // 5
  "Tu as la connexion.",                               // 6
  "Il te manque\nla MÉTHODE.",                         // 7
  "PACK MONEY BOOST\n2026",                             // 8 brand
  "15 services digitaux\nà lancer maintenant",          // 9
  "50 scripts WhatsApp\nprêts à l'emploi",              // 10
  "0 → 500 000 FCFA\navant le 31 décembre",             // 11
  "Un canal WhatsApp\nrien que pour toi",               // 12
  "Je t'accompagne.\nTu n'es pas seul.",                // 13
  "Chaque jour d'attente\n= revenus perdus.",           // 14
  "Le lien est\njuste en bas.",                         // 15
  "Accès instantané.",                                  // 16
  "Paiement mobile\naccepté.",                          // 17
  "LE CHANGEMENT\nC'EST MAINTENANT.",                   // 18
];

// ---- math helpers ---------------------------------------------------------
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const spring=t=>{t=clamp(t,0,1);return 1-Math.pow(2,-10*t)*Math.cos((t*10-0.75)*2.094);};
let T=0;
function seg(i){const s=window.TIMELINE[i]??(i*3);const e=window.TIMELINE[i+1]??(s+3);return [s,e];}
function since(i){return T-seg(i)[0];}
function tin(start,dur){return clamp((T-start)/dur,0,1);} // 0..1 progress
function activeLine(){let idx=-1;for(let i=0;i<LINES.length;i++){if(T>=seg(i)[0])idx=i;}return idx;}

// ---- drawing helpers ------------------------------------------------------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function setFont(size,weight,font){ctx.font=`${weight||800} ${size}px ${font||'Arial, Helvetica, sans-serif'}`;}
function fit(lines,size,weight,maxw){setFont(size,weight);let wmax=0;for(const l of lines)wmax=Math.max(wmax,ctx.measureText(l).width);return wmax>maxw?size*maxw/wmax:size;}
function text(str,x,y,size,o={}){
  ctx.save();
  ctx.textAlign=o.align||'center';ctx.textBaseline=o.baseline||'middle';
  if(o.spacing)ctx.letterSpacing=o.spacing+'px';
  const lines=str.split('\n');
  size=fit(lines,size,o.weight||800,o.maxw||(W-90));
  setFont(size,o.weight||800,o.font);
  const lh=size*(o.lh||1.16); let yy=y-(lines.length-1)*lh/2;
  for(const ln of lines){
    if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=o.glowBlur||28;}
    if(o.stroke){ctx.lineWidth=o.strokeW||6;ctx.strokeStyle=o.stroke;ctx.strokeText(ln,x,yy);}
    ctx.fillStyle=o.color||'#fff';ctx.fillText(ln,x,yy);yy+=lh;
  }
  ctx.restore();
}
// kinetic caption: words pop in, staggered
function kinetic(str,x,y,size,startT,o={}){
  const lines=str.split('\n');
  size=fit(lines,size,o.weight||850,o.maxw||(W-110));
  setFont(size,o.weight||850,o.font);
  const lh=size*1.18; let yy=y-(lines.length-1)*lh/2; let wi=0;
  const stag=0.07;
  for(const ln of lines){
    const words=ln.split(' ');
    const widths=words.map(w=>ctx.measureText(w+' ').width);
    const total=widths.reduce((a,b)=>a+b,0)-(words.length?ctx.measureText(' ').width:0);
    let xx=x-total/2;
    for(let k=0;k<words.length;k++){
      const p=clamp((T-startT-wi*stag)/0.28,0,1);
      if(p>0){
        const e=spring(p), a=easeOut(clamp(p*1.5,0,1));
        ctx.save();
        const cw=ctx.measureText(words[k]).width;
        ctx.translate(xx+cw/2, yy+(1-e)*18);
        ctx.scale(lerp(1.25,1,e),lerp(1.25,1,e));
        ctx.globalAlpha=a;
        ctx.textAlign='center';ctx.textBaseline='middle';
        if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=22;}
        ctx.fillStyle=o.color||'#fff';
        setFont(size,o.weight||850,o.font);
        ctx.fillText(words[k],0,0);
        ctx.restore();
      }
      xx+=widths[k]; wi++;
    }
    yy+=lh;
  }
}

// ---- background -----------------------------------------------------------
function background(){
  const bs=seg(8)[0];
  const warm=clamp((T-bs)/3.0,0,1);
  const top=[lerp(13,32,warm),lerp(17,21,warm),lerp(33,40,warm)];
  const bot=[lerp(5,64,warm),lerp(8,38,warm),lerp(17,10,warm)];
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgb(${top[0]|0},${top[1]|0},${top[2]|0})`);
  g.addColorStop(1,`rgb(${bot[0]|0},${bot[1]|0},${bot[2]|0})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // rotating light rays
  ctx.save();ctx.translate(W/2,H*0.34);ctx.globalCompositeOperation='lighter';
  const rays=10;
  for(let i=0;i<rays;i++){
    const ang=T*0.12+i*Math.PI*2/rays;
    const a=(0.025+0.03*warm);
    ctx.save();ctx.rotate(ang);
    const lg=ctx.createLinearGradient(0,0,0,-1400);
    lg.addColorStop(0,`rgba(${warm>0?255:120},${warm>0?205:160},${warm>0?120:255},${a})`);
    lg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=lg;ctx.beginPath();ctx.moveTo(-70,0);ctx.lineTo(70,0);ctx.lineTo(180,-1400);ctx.lineTo(-180,-1400);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  // particles (parallax)
  for(let i=0;i<60;i++){
    const sx=(i*137%W), base=(i*89%H);
    const sp=14+i%7*6;
    const y=(base+T*sp)%(H+60)-30, x=sx+Math.sin(T*0.7+i)*26;
    const a=0.05+0.07*((i%5)/5)+0.06*warm;
    ctx.fillStyle=`rgba(${warm>0?255:160},${warm>0?210:195},${warm>0?150:255},${a})`;
    ctx.beginPath();ctx.arc(x,y,1.4+(i%3),0,7);ctx.fill();
  }
  // gold glow after discovery
  if(warm>0){
    const gg=ctx.createRadialGradient(W/2,H*0.42,80,W/2,H*0.42,950);
    gg.addColorStop(0,`rgba(255,196,84,${0.18*warm})`);gg.addColorStop(1,'rgba(255,196,84,0)');
    ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);
  }
  const v=ctx.createRadialGradient(W/2,H/2,480,W/2,H/2,1250);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.6)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}

// ---- flying coins (act 3) -------------------------------------------------
function coins(prog){
  if(prog<=0)return;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<14;i++){
    const life=((T*0.4+i*0.5)%2)/2;
    const x=W*0.2+ (i*53%Math.round(W*0.6));
    const y=lerp(1250,300,life);
    const a=Math.sin(life*Math.PI)*0.9*prog;
    const s=0.5+0.5*Math.sin(T*3+i);
    ctx.save();ctx.translate(x,y);ctx.scale(1,0.6+0.4*Math.abs(s));ctx.globalAlpha=a;
    ctx.fillStyle='#ffcf52';ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fill();
    ctx.fillStyle='#e0a92e';ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

// ---- character ------------------------------------------------------------
function drawMan(cx,cy,scale,mood){
  // idle motion: breathing + subtle bob + blink
  const breathe=1+0.012*Math.sin(T*1.8);
  const bob=Math.sin(T*1.2)*(mood>0.5?6:3);
  const blink=(Math.sin(T*2.1)>0.97)?0.15:1;
  ctx.save();
  ctx.translate(cx,cy+bob);ctx.scale(scale,scale*breathe);
  const slump=(1-mood);
  ctx.translate(0,slump*26);ctx.rotate(slump*0.05);
  const shirt=mood>0.5?'#2f7d5b':'#3a4a63', shirtSh=mood>0.5?'#245f46':'#2c3a4f';
  const skin='#caa07a', skinSh='#b4895f';
  ctx.fillStyle='rgba(0,0,0,0.25)';rr(-150,150,300,46,20);ctx.fill();
  ctx.fillStyle=shirt;rr(-120,40+slump*20,240,170,60);ctx.fill();
  ctx.fillStyle=shirtSh;rr(-120,150,240,60,40);ctx.fill();
  ctx.fillStyle=shirt;ctx.beginPath();ctx.arc(-120,90+slump*18,58,0,7);ctx.arc(120,90+slump*18,58,0,7);ctx.fill();
  ctx.strokeStyle=shirt;ctx.lineCap='round';ctx.lineWidth=46;ctx.beginPath();
  // arms: worried hands on head; confident open + gentle wave
  const wave=Math.sin(T*2.4)*8*mood;
  if(mood<0.5){ctx.moveTo(-110,95);ctx.lineTo(-60,30);ctx.moveTo(110,95);ctx.lineTo(60,30);}
  else{ctx.moveTo(-110,100);ctx.lineTo(-160,30+wave);ctx.moveTo(110,100);ctx.lineTo(150,10-wave);}
  ctx.stroke();
  ctx.fillStyle=skin;
  if(mood<0.5){ctx.beginPath();ctx.arc(-60,20,24,0,7);ctx.arc(60,20,24,0,7);ctx.fill();}
  else{ctx.beginPath();ctx.arc(-160,18+wave,24,0,7);ctx.arc(150,-2-wave,24,0,7);ctx.fill();}
  ctx.fillStyle=skinSh;rr(-26,-30,52,80,20);ctx.fill();
  ctx.save();ctx.translate(0,-70-mood*8);ctx.rotate(slump*0.20+Math.sin(T*0.9)*0.02);
  ctx.fillStyle=skin;ctx.beginPath();ctx.arc(0,0,70,0,7);ctx.fill();
  ctx.fillStyle='#241a14';ctx.beginPath();ctx.arc(0,-12,70,Math.PI*1.05,Math.PI*1.95);ctx.fill();rr(-70,-30,140,30,14);ctx.fill();
  ctx.fillStyle='#2a1f17';const eyeY=4;
  ctx.save();ctx.translate(0,eyeY);ctx.scale(1,blink);
  ctx.beginPath();ctx.arc(-26,0,6,0,7);ctx.arc(26,0,6,0,7);ctx.fill();ctx.restore();
  ctx.strokeStyle='#2a1f17';ctx.lineWidth=6;ctx.lineCap='round';const browY=mood<0.5?-16:-12;ctx.beginPath();
  if(mood<0.5){ctx.moveTo(-40,browY-2);ctx.lineTo(-14,browY+8);ctx.moveTo(40,browY-2);ctx.lineTo(14,browY+8);}
  else{ctx.moveTo(-40,browY+4);ctx.lineTo(-14,browY);ctx.moveTo(40,browY+4);ctx.lineTo(14,browY);}
  ctx.stroke();
  ctx.beginPath();const my=34;ctx.moveTo(-22,my);ctx.quadraticCurveTo(0,my+lerp(-14,16,mood),22,my);ctx.lineWidth=6;ctx.stroke();
  ctx.restore();ctx.restore();
}

// ---- desk -----------------------------------------------------------------
function deskScene(mood){
  ctx.fillStyle='rgba(0,0,0,0.30)';rr(W/2-360,1180,720,40,14);ctx.fill();
  ctx.fillStyle=mood>0.5?'rgba(70,55,35,0.55)':'rgba(40,46,60,0.55)';rr(W/2-380,1180,760,260,18);ctx.fill();
  drawMan(W/2,1020,1.0,mood);
  ctx.save();ctx.translate(W/2+210,1196+Math.sin(T*1.2)*2);
  ctx.fillStyle='#11161f';rr(-120,-86,240,96,10);ctx.fill();
  ctx.fillStyle=mood>0.5?'#1f8f5f':'#26405e';rr(-108,-76,216,74,6);ctx.fill();
  ctx.fillStyle='#0b0e14';rr(-140,8,280,18,8);ctx.fill();ctx.restore();
}

// ---- chart ----------------------------------------------------------------
function chart(x,y,w,h,prog){
  ctx.save();ctx.translate(x,y);
  ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-h);ctx.moveTo(0,0);ctx.lineTo(w,0);ctx.stroke();
  const n=6;
  for(let i=0;i<n;i++){const bp=clamp(prog*n-i,0,1);const bh=(0.18+0.82*(i/(n-1)))*h*spring(bp);const bx=8+i*(w-8)/n,bw=(w-8)/n-14;
    const g=ctx.createLinearGradient(0,-bh,0,0);g.addColorStop(0,'#ffd36b');g.addColorStop(1,'#f7a23b');ctx.fillStyle=g;rr(bx,-bh,bw,bh,8);ctx.fill();}
  ctx.strokeStyle='#7CFFB2';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();
  const pts=8,lp=clamp(prog,0,1);
  for(let i=0;i<=pts;i++){const px=(i/pts)*w,py=-(i/pts)*h*0.9*Math.pow((i/pts),0.7);if(i/pts<=lp){if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}}
  ctx.stroke();
  // moving spark at the head of the line
  if(lp>0.05){const px=lp*w,py=-lp*h*0.9*Math.pow(lp,0.7);ctx.fillStyle='#cffae0';ctx.shadowColor='#7CFFB2';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(px,py,9,0,7);ctx.fill();}
  ctx.restore();
}

// ---- checklist ------------------------------------------------------------
function checklist(x,y,prog){
  const items=4,gap=92;
  for(let i=0;i<items;i++){const iy=y+i*gap;
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=4;rr(x,iy,58,58,14);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.28)';rr(x+82,iy+18,260-(i*18),22,11);ctx.fill();
    const cp=clamp(prog*items-i,0,1);
    if(cp>0){const e=spring(cp);ctx.save();ctx.strokeStyle='#7CFFB2';ctx.lineWidth=9;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(x+12,iy+30);ctx.lineTo(x+12+14*Math.min(e*2,1),iy+30+14*Math.min(e*2,1));
      if(e>0.5)ctx.lineTo(x+12+14+(46-14)*((e-0.5)*2),iy+30+14-30*((e-0.5)*2));ctx.stroke();ctx.restore();}
  }
}

// ---- phone with brand -----------------------------------------------------
function phone(cx,cy,scale,glow){
  ctx.save();ctx.translate(cx,cy);ctx.scale(scale,scale);
  ctx.shadowColor=`rgba(255,190,80,${0.85*glow})`;ctx.shadowBlur=90*glow;
  ctx.fillStyle='#0c0f16';rr(-150,-300,300,600,46);ctx.fill();ctx.shadowBlur=0;
  const g=ctx.createLinearGradient(0,-280,0,280);g.addColorStop(0,'#10141d');g.addColorStop(1,'#0a0d13');ctx.fillStyle=g;rr(-132,-282,264,564,34);ctx.fill();
  ctx.restore();
}

// ---- CTA ------------------------------------------------------------------
function ctaButton(){
  const pulse=1+0.035*Math.sin(T*5);
  ctx.save();ctx.translate(W/2,1500);ctx.scale(pulse,pulse);
  ctx.shadowColor='rgba(124,255,178,0.6)';ctx.shadowBlur=44;
  const g=ctx.createLinearGradient(-300,0,300,0);g.addColorStop(0,'#21c275');g.addColorStop(1,'#13a85f');ctx.fillStyle=g;rr(-330,-66,660,132,66);ctx.fill();ctx.shadowBlur=0;
  text("ACCÉDER AU PACK",0,0,52,{color:'#08210f',weight:900,spacing:1});ctx.restore();
  const by=1600+Math.sin(T*4)*14;text("⬇",W/2,by,72,{color:'#7CFFB2'});
}

function progressBar(){const p=clamp(T/window.DURATION,0,1);ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fillRect(0,0,W,8);ctx.fillStyle='#ffce5a';ctx.fillRect(0,0,W*p,8);}

// ---- camera: per-act push-in + sway + transition pop ----------------------
function camera(){
  // which act
  const a1=seg(8)[0],a2=seg(9)[0],a3=seg(15)[0];
  let st;
  if(T<a1)st=0; else if(T<a2)st=a1; else if(T<a3)st=a2; else st=a3;
  const local=T-st;
  const z=lerp(1.0,1.06,easeOut(clamp(local/8,0,1)));        // slow push-in
  const pop=lerp(0.94,1.0,easeOut(clamp(local/0.5,0,1)));     // transition pop
  const sway=Math.sin(T*0.5)*6;
  ctx.translate(W/2+sway, H/2);ctx.scale(z*pop,z*pop);ctx.translate(-W/2,-H/2);
  return clamp(1-local/0.35,0,1); // flash amount at scene start
}

// ===========================================================================
function frame(t){
  T=t;ctx.clearRect(0,0,W,H);
  background();
  ctx.save();
  const flash=camera();

  const discS=seg(8)[0], growS=seg(9)[0], pgrowS=seg(11)[0], waS=seg(12)[0], ctaS=seg(15)[0];
  const mood=clamp((T-discS)/6.0,0,1);
  const brandWarm=clamp((T-discS)/2.6,0,1);

  if(T<discS){
    // ACT 1 — worried
    deskScene(0);
    // calendar drops in
    const ci=spring(tin(0,0.6));
    ctx.save();ctx.translate(W/2-300,560-(1-ci)*60);ctx.globalAlpha=ci;
    ctx.fillStyle='#e9edf3';rr(-110,-130,220,200,18);ctx.fill();
    ctx.fillStyle='#cf4b4b';rr(-110,-130,220,54,18);ctx.fill();ctx.fillRect(-110,-104,220,16);
    ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
    const yr=T>seg(0)[0]+0.6?'2027':'2026';setFont(86,900);ctx.fillStyle='#1d2330';ctx.fillText(yr,0,-26);ctx.restore();
    ctx.restore();
    text('OBJECTIFS : 0 / 5',W/2-300,668,30,{color:'#aeb6c6',weight:800});
    // checklist slides from right (empty)
    const k=easeOut(tin(seg(1)[0]-0.3,0.6));
    ctx.save();ctx.globalAlpha=k;ctx.translate((1-k)*120,0);checklist(W/2+150,470,0);ctx.restore();
  } else if(T<growS){
    // ACT 2 — discovery
    deskScene(mood*0.5);
    phone(W/2,760,lerp(0.55,1.0,spring(tin(discS,0.7))),brandWarm);
    ctx.save();ctx.globalAlpha=brandWarm;
    const ke=tin(discS+0.2,0.5);
    if(ke>0){
      kinetic("PACK",W/2,660,72,discS+0.15,{color:'#ffce5a',weight:900,glow:'rgba(255,200,80,0.8)'});
      kinetic("MONEY",W/2,742,72,discS+0.30,{color:'#fff',weight:900});
      kinetic("BOOST",W/2,824,72,discS+0.45,{color:'#fff',weight:900});
      kinetic("2026",W/2,910,52,discS+0.62,{color:'#7CFFB2',weight:900});
    }
    ctx.restore();
  } else if(T<ctaS){
    // ACT 3 — growth
    deskScene(1);
    coins(clamp((T-growS)/2,0,1));
    chart(W/2-330,760,300,260,clamp((T-growS)/5.5,0,1));
    const k=easeOut(tin(growS-0.2,0.6));
    ctx.save();ctx.globalAlpha=k;ctx.translate((1-k)*100,0);checklist(W/2+40,540,clamp((T-growS)/5.0,0,1));ctx.restore();
    if(T>=pgrowS){
      const cp=easeOut(clamp((T-pgrowS)/3.5,0,1));const val=Math.round(cp*500000/1000)*1000;
      const pop=spring(tin(pgrowS,0.5));
      ctx.save();ctx.globalAlpha=0.5*pop;ctx.fillStyle='rgba(0,0,0,0.32)';rr(W/2-360,360,720,120,26);ctx.fill();ctx.restore();
      ctx.save();ctx.translate(W/2,420);ctx.scale(lerp(0.7,1,pop),lerp(0.7,1,pop));
      text(val.toLocaleString('fr-FR')+" FCFA",0,0,78,{color:'#ffd36b',weight:900,glow:'rgba(255,200,80,0.5)',maxw:660});ctx.restore();
    }
    if(T>=waS){const a=easeOut(tin(waS,0.5));ctx.save();ctx.globalAlpha=a;
      ctx.translate(W/2,560+Math.sin(T*2)*6);ctx.scale(spring(a),spring(a));
      ctx.fillStyle='#25D366';ctx.beginPath();ctx.arc(0,0,58,0,7);ctx.fill();
      text("✓",0,0,64,{color:'#fff',weight:900});ctx.restore();}
  } else {
    // ACT 4 — CTA
    drawMan(W/2,540,0.62,1);
    if(T>=seg(18)[0])ctaButton();
    else{const labels=["📱 Mobile Money","⚡ Instantané","🔒 Sécurisé"];labels.forEach((l,i)=>{if(T>=seg(15+i)[0]){const a=easeOut(tin(seg(15+i)[0],0.4));ctx.save();ctx.globalAlpha=a;ctx.translate((1-a)*60,0);text(l,W/2,1180+i*120,46,{color:'#dfe6f0',weight:800});ctx.restore();}});}
  }

  // ---- kinetic caption ----------------------------------------------------
  const idx=activeLine();
  if(idx>=0 && idx!==8){
    const ls=seg(idx)[0];
    if(idx===18){
      kinetic(LINES[idx],W/2,1190,84,ls,{color:'#fff',weight:900,glow:'rgba(255,206,90,0.6)'});
    }else{
      const yPos=(idx>=15)?990:1640;
      const a=easeOut(tin(ls,0.35));
