<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}#c{display:block}</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="timeline.js"></script>
<script>
// ===========================================================================
// PACK MONEY BOOST 2026 — Storytelling (nouveau jeu d'images, contexte africain).
// Montages découpés en panneaux affichés un par un (scènes 2,3,4), photos hero
// en plein cadre (scènes 1,6,7), overlay animé « pluie de commandes » (scène 5).
// Deterministic: window.seek(t).
// ===========================================================================
const W=1080,H=1920;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SEG=window.SEG, DUR=window.DURATION;
const GOLD='#f4b400', WA='#25D366';

const P='assets/parts2/';
const SRC={
  n1:'assets/n1.png', n5:'assets/n5.png', n6:'assets/n6.png', n7:'assets/n7.png',
  s2_trading:P+'s2_trading.png', s2_formation:P+'s2_formation.png', s2_pensive:P+'s2_pensive.png',
  s2_wallet:P+'s2_wallet.png', s2_despair:P+'s2_despair.png',
  s3_think:P+'s3_think.png', s3_market:P+'s3_market.png', s3_phone:P+'s3_phone.png',
  s3_globe:P+'s3_globe.png', s3_kiosk:P+'s3_kiosk.png', s3_services:P+'s3_services.png',
  s3_shop:P+'s3_shop.png', s3_ia:P+'s3_ia.png', s3_learning:P+'s3_learning.png',
  s4_phone1:P+'s4_phone1.png', s4_canva:P+'s4_canva.png', s4_design2:P+'s4_design2.png',
  s4_meeting:P+'s4_meeting.png', s4_smiling:P+'s4_smiling.png', s4_happy:P+'s4_happy.png',
  s4_chat1:P+'s4_chat1.png', s4_payment:P+'s4_payment.png', s4_chat3:P+'s4_chat3.png',
  s4_orders:P+'s4_orders.png',
};
const IMG={}, BG={};

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3);
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOutBack=t=>1+2.5*Math.pow(t-1,3)+1.6*Math.pow(t-1,2);
let T=0;

const KB=[
  {z0:1.05,z1:1.17, x0:-0.55,y0:-0.20, x1:0.55,y1:0.22},
  {z0:1.17,z1:1.05, x0:0.50,y0:0.28,  x1:-0.45,y1:-0.26},
  {z0:1.06,z1:1.18, x0:0.52,y0:-0.30, x1:-0.50,y1:0.30},
  {z0:1.18,z1:1.06, x0:-0.50,y0:0.30, x1:0.48,y1:-0.28},
  {z0:1.05,z1:1.16, x0:0.0, y0:-0.55, x1:0.0, y1:0.45},
  {z0:1.16,z1:1.05, x0:-0.52,y0:-0.28,x1:0.52,y1:0.30},
];

const ORD=[]; {const c={}; for(const s of SEG){c[s.scene]=c[s.scene]||0; ORD.push(c[s.scene]++);}}
function segIndexAt(t){let k=0;for(let i=0;i<SEG.length;i++)if(t>=SEG[i].t)k=i;return k;}
function endOf(i){return i+1<SEG.length?SEG[i+1].t:DUR;}

// ---- shot plan per segment ------------------------------------------------
const SC2=['s2_trading','s2_formation','s2_pensive',['s2_trading','s2_formation'],'s2_wallet','s2_despair'];
const SC3=['s3_think','s3_market','s3_phone','s3_globe','s3_services','s3_kiosk'];
const SC4=['s3_shop','s3_kiosk','s3_globe',['s3_ia','s3_learning']];
const SC5=['s4_phone1','s4_canva','s4_design2','s4_meeting','s4_smiling','s4_happy',
           's4_chat1',['s4_payment','s4_chat3'],'s4_orders','n5'];
function planFor(i){
  const sc=SEG[i].scene, o=ORD[i], pick=a=>a[o]!==undefined?a[o]:a[a.length-1];
  if(sc===1) return {img:'n1'};
  if(sc===2) return {img:pick(SC2)};
  if(sc===3) return {img:pick(SC3)};
  if(sc===4) return {img:pick(SC4)};
  if(sc===5) return {img:pick(SC5), fx:(o===8?'orders':null)};
  if(sc===6) return {img:'n6'};
  if(sc===7) return {img:'n7'};
  return {img:'n1'};
}
const SHOTS=[]; {
  const raw=[];
  for(let i=0;i<SEG.length;i++){const p=planFor(i); if(!p.img) continue;
    const st=SEG[i].t, en=endOf(i), ims=Array.isArray(p.img)?p.img:[p.img], d=(en-st)/ims.length;
    ims.forEach((k,j)=>raw.push({img:k,start:st+j*d,end:st+(j+1)*d}));}
  for(const s of raw){const l=SHOTS[SHOTS.length-1];
    if(l&&l.img===s.img&&Math.abs(l.end-s.start)<0.01) l.end=s.end; else SHOTS.push({...s});}
}
function shotAt(t){let s=SHOTS[0];for(const x of SHOTS)if(t>=x.start)s=x;return s;}

function buildBG(key){
  const img=IMG[key]; if(!img||!img.naturalWidth) return;
  const oc=document.createElement('canvas'); oc.width=W; oc.height=H;
  const o=oc.getContext('2d');
  const iw=img.naturalWidth, ih=img.naturalHeight, s=Math.max(W/iw,H/ih)*1.15;
  const dw=iw*s, dh=ih*s;
  o.filter='blur(34px) brightness(0.5) saturate(1.1)';
  o.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh); o.filter='none';
  o.fillStyle='rgba(6,8,12,0.34)'; o.fillRect(0,0,W,H);
  BG[key]=oc;
}
const COVER=new Set(['n1']);   // hero photo: full-bleed Ken Burns; everything else: contain
function drawImgShot(shot,t,alpha){
  const img=IMG[shot.img]; if(!img||!img.naturalWidth) return;
  const d=Math.max(shot.end-shot.start,0.001), e=easeIO(clamp((t-shot.start)/d,0,1));
  const iw=img.naturalWidth, ih=img.naturalHeight;
  const k=KB[Math.max(0,SHOTS.indexOf(shot))%KB.length];
  ctx.save(); ctx.globalAlpha=alpha;
  if(COVER.has(shot.img)){
    const base=Math.max(W/iw,H/ih), scl=base*lerp(k.z0,k.z1,e);
    const dw=iw*scl, dh=ih*scl;
    const px=lerp(k.x0,k.x1,e)*((dw-W)/2), py=lerp(k.y0,k.y1,e)*((dh-H)/2);
    ctx.drawImage(img,(W-dw)/2+px,(H-dh)/2+py,dw,dh);
  } else {
    if(BG[shot.img]) ctx.drawImage(BG[shot.img],0,0);
    const base=Math.min(W/iw,H/ih)*0.94, scl=base*lerp(1.0,1.03,e);
    const dw=iw*scl, dh=ih*scl, px=lerp(k.x0,k.x1,e)*9, py=lerp(k.y0,k.y1,e)*9;
    ctx.drawImage(img,(W-dw)/2+px,(H-dh)/2+py,dw,dh);
  }
  ctx.restore();
}

// ---- ambient life ---------------------------------------------------------
const BOKEH=Array.from({length:13},(_,i)=>({bx:(i*0.1373+0.04)%1,by:(i*0.2310+0.07)%1,
  r:22+(i%5)*16, sp:0.010+(i%4)*0.004, ph:i*0.77}));
function bokeh(t){ctx.save(); ctx.globalCompositeOperation='screen';
  for(const b of BOKEH){const yy=(((b.by-t*b.sp)%1)+1)%1, xx=b.bx+Math.sin(t*0.18+b.ph)*0.022;
    const cx=xx*W, cy=yy*H, al=Math.max(0,0.05+0.045*Math.sin(t*0.5+b.ph));
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,b.r);
    g.addColorStop(0,`rgba(255,212,138,${al})`); g.addColorStop(1,'rgba(255,212,138,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,b.r,0,7); ctx.fill();}
  ctx.restore();}
function lightSweep(t){const p=(t*0.045)%1, cx=lerp(-0.25,1.25,p)*W;
  const g=ctx.createRadialGradient(cx,H*0.34,0,cx,H*0.34,920);
  g.addColorStop(0,'rgba(255,238,196,0.07)'); g.addColorStop(1,'rgba(255,238,196,0)');
  ctx.save(); ctx.globalCompositeOperation='screen'; ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.restore();}
function grade(){const v=ctx.createRadialGradient(W/2,H*0.46,560,W/2,H/2,1180);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.34)');
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);}

// ---- text -----------------------------------------------------------------
function setFont(s,w){ctx.font=`${w||800} ${s}px Arial, Helvetica, sans-serif`;}
function wrap(str,s,w,maxw){setFont(s,w);const out=[];
  for(const para of String(str).split('\n')){const words=para.split(' ');let cur='';
    for(const wd of words){const test=cur?cur+' '+wd:wd;if(ctx.measureText(test).width>maxw&&cur){out.push(cur);cur=wd;}else cur=test;}
    out.push(cur);}
  return out;}
function softText(str,x,y,size,startT,o={}){
  const p=clamp((T-startT)/0.5,0,1), a=easeOut(p); if(a<=0)return;
  const sc=lerp(0.9,1,easeOutBack(p));
  const lines=wrap(str,size,o.weight||800,o.maxw||(W-180));
  const lh=size*1.22; let yy=y-(lines.length-1)*lh/2;
  ctx.save(); ctx.globalAlpha=a; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.translate(x,y); ctx.scale(sc,sc); ctx.translate(-x,-y+(1-a)*14);
  for(const ln of lines){ctx.shadowColor='rgba(0,0,0,0.9)'; ctx.shadowBlur=18;
    setFont(size,o.weight||800); ctx.fillStyle=o.color||'#fff'; ctx.fillText(ln,x,yy); yy+=lh;}
  ctx.restore();}
function captionBox(str,startT,opts={}){
  const y=opts.y||1560, a=easeOut(clamp((T-startT)/0.45,0,1));
  ctx.save(); ctx.globalAlpha=a*0.5;
  const g=ctx.createLinearGradient(0,y-150,0,y+150);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(.5,'rgba(0,0,0,0.8)'); g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g; ctx.fillRect(0,y-160,W,320); ctx.restore();
  softText(str,W/2,y,opts.size||52,startT,{weight:opts.weight||800,color:opts.color||'#fff'});}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function scrim(a){ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#05070b';ctx.fillRect(0,0,W,H);ctx.restore();}
function waGlyph(cx,cy,r){
  ctx.fillStyle=WA; ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=r*0.17; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(cx,cy,r*0.52,Math.PI*0.82,Math.PI*2.4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-r*0.35,cy-r*0.35); ctx.lineTo(cx-r*0.10,cy-r*0.05);
  ctx.lineTo(cx-r*0.45,cy+0); ctx.closePath(); ctx.fill();
}

// ---- overlay animé : pluie de commandes (scène 5) -------------------------
function orderChip(cx,cy,sc,a,n){
  ctx.save(); ctx.globalAlpha=a; ctx.translate(cx,cy); ctx.scale(sc,sc);
  ctx.shadowColor='rgba(0,0,0,0.4)'; ctx.shadowBlur=24;
  ctx.fillStyle='#fff'; rr(-160,-54,320,108,26); ctx.fill(); ctx.shadowBlur=0;
  waGlyph(-104,0,38);
  ctx.fillStyle='#0b6b34'; setFont(24,800); ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText('WhatsApp',-50,-18);
  ctx.fillStyle='#1a1f29'; setFont(24,500); ctx.fillText('Nouvelle commande',-50,16);
  ctx.fillStyle='#ff3b30'; ctx.beginPath(); ctx.arc(142,-44,26,0,7); ctx.fill();
  ctx.fillStyle='#fff'; setFont(26,800); ctx.textAlign='center'; ctx.fillText(String(n),142,-43);
  ctx.restore();
}
function drawOrders(p){
  scrim(0.42*clamp(p*2,0,1));
  const slots=[[W/2,560],[W/2-150,770],[W/2+160,730],[W/2-120,990],[W/2+150,970],[W/2,1190]];
  for(let i=0;i<slots.length;i++){
    const st=i*0.12, a=clamp((p-st)/0.16,0,1); if(a<=0) continue;
    const eb=easeOutBack(clamp(a*1.3,0,1)), sc=lerp(0.6,1,eb);
    orderChip(slots[i][0],slots[i][1]+(1-eb)*20,sc,Math.min(a,1),i+1);
  }
  softText('Et plusieurs demandes…',W/2,1430,50,0,{weight:800,color:'#fff'});
}

// ===========================================================================
function frame(t){
  T=t; ctx.clearRect(0,0,W,H); ctx.fillStyle='#05070b'; ctx.fillRect(0,0,W,H);
  const si=segIndexAt(t), sc=SEG[si].scene, p=planFor(si);

  const shot=shotAt(t), idx=SHOTS.indexOf(shot), prev=SHOTS[idx-1];
  const XF=0.55, into=prev && (t-shot.start)<XF && Math.abs(prev.end-shot.start)<0.01;
  if(into){ drawImgShot(prev,t,1); drawImgShot(shot,t,easeIO((t-shot.start)/XF)); }
  else drawImgShot(shot,t,1);
  grade(); lightSweep(t); bokeh(t);

  if(p.fx==='orders'){
    const st=SEG[si].t, en=endOf(si), loc=clamp((t-st)/Math.max(en-st,0.001),0,1);
    drawOrders(loc);
  }

  const cap=SEG[si].cap;
  if(cap && cap!=='WA' && cap!=='PAY' && cap.length>2)
    captionBox(cap,SEG[si].t,{y:1560,size:cap.indexOf('→')>=0?50:54,color:cap.indexOf('→')>=0?'#ffe08a':'#fff'});

  if(sc===7){const ts=SHOTS.find(s=>s.img==='n7').start;
    softText('Construis tes premières\nopportunités en ligne.',W/2,250,44,ts+0.6,{weight:700,color:'#f2f4f8',maxw:W-150});}
}

// ---- preload --------------------------------------------------------------
let loaded=0, keys=Object.keys(SRC);
keys.forEach(k=>{const im=new Image();
  im.onload=()=>{IMG[k]=im; buildBG(k); loaded++; if(loaded===keys.length){frame(0); window.__ready=true;}};
  im.onerror=()=>{loaded++; if(loaded===keys.length){frame(0); window.__ready=true;}};
  im.src=SRC[k]; IMG[k]=im;});
window.seek=function(t){frame(Math.max(0,Math.min(t,DUR)));};
</script>
</body>
</html>
