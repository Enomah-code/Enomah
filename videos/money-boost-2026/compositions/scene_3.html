<template id="scene_3-template">
  <div id="root" class="scene_3-root" data-composition-id="scene_3" data-width="1080" data-height="1920" data-duration="3.285" style="position:relative; width:1080px; height:1920px; overflow:hidden;">
    <style>
      /* Root styles use #root only — brand tokens declared once in index.html <head>. */
      #root {
        background-color: var(--canvas);
        background-image: radial-gradient(var(--ink) 1.5px, transparent 1.5px);
        background-size: 32px 32px;
        font-family: var(--font-body);
        perspective: 1600px;
      }
      #root *,
      #root *::before,
      #root *::after {
        box-sizing: border-box;
      }

      /* Vertical-dolly camera carrier */
      .s3-stage {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        transform-style: preserve-3d;
        will-change: transform;
      }

      /* Two stacked bands — top passive (blue), bottom active (orange) */
      .s3-band {
        position: relative;
        width: 880px;
        height: 560px;
        background: var(--canvas);
        border: var(--border-loud);
        box-shadow: var(--shadow-hard);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 60px 64px;
        gap: 22px;
        transform-style: preserve-3d;
        will-change: transform, opacity;
      }
      .s3-band-top {
        z-index: 1;
      }
      .s3-band-bottom {
        background: var(--brand-primary);
        z-index: 1;
      }

      .s3-eyebrow {
        font-family: var(--font-mono);
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 7px;
        text-transform: uppercase;
        color: var(--brand-secondary);
      }
      .s3-band-bottom .s3-eyebrow {
        color: var(--canvas);
      }
      .s3-bandword {
        font-family: var(--font-display);
        font-size: 196px;
        line-height: 0.92;
        letter-spacing: -2px;
        text-transform: uppercase;
        color: var(--brand-secondary);
        opacity: 0.32;
      }
      .s3-band-bottom .s3-bandword {
        color: var(--canvas);
        opacity: 0.62;
      }
      .s3-bandsub {
        font-family: var(--font-mono);
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--ink);
      }
      .s3-band-bottom .s3-bandsub {
        color: var(--canvas);
      }

      /* Corner-pins (pasted component, prefixed) */
      .s3-corner {
        position: absolute;
        width: 26px;
        height: 26px;
        background: var(--ink);
        z-index: 3;
      }
      .s3-band-bottom .s3-corner {
        background: var(--canvas);
      }
      .s3-tl { top: -3px; left: -3px; }
      .s3-tr { top: -3px; right: -3px; }
      .s3-bl { bottom: -3px; left: -3px; }
      .s3-br { bottom: -3px; right: -3px; }

      /* Bicolor seam headline — lands on the band seam */
      .s3-seam {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        will-change: transform;
        white-space: nowrap;
      }
      .s3-seam-line {
        font-family: var(--font-display);
        font-size: 168px;
        line-height: 0.9;
        letter-spacing: -3px;
        text-transform: uppercase;
        background: var(--canvas);
        border: var(--border-loud);
        box-shadow: var(--shadow-hard);
        padding: 6px 30px;
      }
      .s3-subir { color: var(--brand-secondary); }
      .s3-or {
        font-family: var(--font-mono);
        font-size: 44px;
        font-weight: 700;
        letter-spacing: 6px;
        color: var(--ink);
        text-transform: uppercase;
      }
      .s3-booster { color: var(--brand-primary); }
    </style>

    <div class="s3-stage">
      <!-- TOP BAND — passive drift: scroll / spend (blue-leaning, lower-energy) -->
      <div class="s3-band s3-band-top clip" data-start="0" data-duration="3.285" data-track-index="0">
        <span class="s3-corner s3-tl"></span>
        <span class="s3-corner s3-tr"></span>
        <span class="s3-corner s3-bl"></span>
        <span class="s3-corner s3-br"></span>
        <div class="s3-eyebrow">SCROLLER. DEPENSER.</div>
        <div class="s3-bandword">SUBIR</div>
        <div class="s3-bandsub">ARGENT QUI FUIT</div>
      </div>

      <!-- BOTTOM BAND — active control: manage / invest (orange-leaning, sharper) -->
      <div class="s3-band s3-band-bottom clip" data-start="0" data-duration="3.285" data-track-index="1">
        <span class="s3-corner s3-tl"></span>
        <span class="s3-corner s3-tr"></span>
        <span class="s3-corner s3-bl"></span>
        <span class="s3-corner s3-br"></span>
        <div class="s3-eyebrow">GERER. INVESTIR.</div>
        <div class="s3-bandword">BOOSTER</div>
        <div class="s3-bandsub">ARGENT QUI BOSSE</div>
      </div>
    </div>

    <!-- Bicolor seam headline forces the binary -->
    <div class="s3-seam clip" data-start="0.85" data-duration="2.435" data-track-index="2">
      <div class="s3-seam-line"><span class="s3-subir">SUBIR</span></div>
      <div class="s3-or">OU</div>
      <div class="s3-seam-line"><span class="s3-booster">BOOSTER&nbsp;?</span></div>
    </div>

    <script>
      const EASE = {
        entry: "back.out(2.4)", // bouncy slam-pop
        emphasis: "expo.out", // hard arrival
        exit: "power4.in", // dive off
        drift: "sine.inOut", // ambient breathing only
      };
      const DUR = {
        snap: 0.18,
        med: 0.45,
        slow: 0.9,
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const STAGE_H = 1920;

      // --- reactive-displacement entry: ONE driver couples both bands ---
      // Top band drives in from the top, bottom band from the bottom; opposing
      // motion so the seam feels physical. Single source of truth = one driver.
      const topBand = document.querySelector(".s3-band-top");
      const bottomBand = document.querySelector(".s3-band-bottom");
      const TOP_START_Y = -STAGE_H * 0.65; // off-stage up
      const BOTTOM_START_Y = STAGE_H * 0.65; // off-stage down
      const TOP_TILT = 9; // split-tilt-cards: opposing rotateX gives book-open depth
      const BOTTOM_TILT = -9;

      gsap.set(topBand, {
        y: TOP_START_Y,
        opacity: 0,
        rotationX: TOP_TILT,
        transformOrigin: "50% 100%",
      });
      gsap.set(bottomBand, {
        y: BOTTOM_START_Y,
        opacity: 0,
        rotationX: BOTTOM_TILT,
        transformOrigin: "50% 0%",
      });

      const driver = { p: 0 };
      const FADE_IN_SHARPNESS = 4;
      tl.to(
        driver,
        {
          p: 1,
          duration: DUR.slow,
          ease: EASE.emphasis, // hard arrival
          onUpdate: () => {
            const p = driver.p;
            const op = Math.min(1, p * FADE_IN_SHARPNESS);
            // top band lands on its resting rotateX, derived from the same driver
            topBand.style.opacity = String(op);
            topBand.style.transform =
              "translateY(" + (TOP_START_Y * (1 - p)) + "px) rotateX(" + (TOP_TILT * (1 - p)) + "deg)";
            // bottom band is the causally-linked partner — opposite direction
            bottomBand.style.opacity = String(op);
            bottomBand.style.transform =
              "translateY(" + (BOTTOM_START_Y * (1 - p)) + "px) rotateX(" + (BOTTOM_TILT * (1 - p)) + "deg)";
          },
        },
        0,
      );

      // --- bicolor seam headline slam-pop entry (lands on the seam) ---
      tl.fromTo(
        ".s3-seam",
        { opacity: 0, scale: 0.6, y: -40 },
        { opacity: 1, scale: 1, y: 0, duration: DUR.med, ease: EASE.entry },
        0.85,
      );

      // --- macro: slow vertical dolly across the seam (one macro move) ---
      tl.fromTo(
        ".s3-stage",
        { y: 34 },
        { y: -26, duration: 3.285, ease: EASE.drift },
        0,
      );

      // --- sine-wave-loop: float on the seam headline only; bands rest ---
      // Runs after the headline settles; sin(0)=0 so no jump from the entry rest.
      const seam = document.querySelector(".s3-seam");
      const IDLE_START = 1.3;
      const IDLE_DUR = 3.285 - IDLE_START;
      const CYCLES = 0.8; // ~2.5s per breath over the short idle window
      const Y_AMP = 5;
      const phase = { p: 0 };
      tl.to(
        phase,
        {
          p: Math.PI * 2 * CYCLES,
          duration: IDLE_DUR,
          ease: "none",
          onUpdate: () => {
            const y = Math.sin(phase.p) * Y_AMP;
            seam.style.transform = "translate(-50%, -50%) translateY(" + y + "px)";
          },
        },
        IDLE_START,
      );

      window.__timelines["scene_3"] = tl;
    </script>
  </div>
</template>
