<template id="scene_7-template">
  <div id="root" class="scene_7-root" data-composition-id="scene_7" data-width="1080" data-height="1920" data-duration="14.53" style="position:relative; width:1080px; height:1920px; overflow:hidden;">
    <style>
      #root {
        background: var(--canvas);
        font-family: var(--font-body);
        perspective: 1600px;
      }
      #root *,
      #root *::before,
      #root *::after {
        box-sizing: border-box;
      }

      /* ---- shared full-bleed beat layers ---- */
      .s7-beat {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      /* ---- ambient dot-grid base ---- */
      .s7-grid-bg {
        position: absolute;
        inset: 0;
        background-color: var(--canvas);
        background-image: radial-gradient(var(--ink) 1.5px, transparent 1.5px);
        background-size: 40px 40px;
        z-index: 0;
      }

      /* ---- corner pins ---- */
      .s7-corner {
        position: absolute;
        width: 40px;
        height: 40px;
        background: var(--ink);
        z-index: 6;
      }
      .s7-tl { top: 40px; left: 40px; }
      .s7-tr { top: 40px; right: 40px; }
      .s7-bl { bottom: 40px; left: 40px; }
      .s7-br { bottom: 40px; right: 40px; }

      /* ---- flat deco sticker blocks (beat 1) ---- */
      .s7-deco-yellow {
        position: absolute;

      /* ---- BEAT 1: eyebrow + CTA button + cursor ---- */

      .s7-cta-btn {

        text-transform: uppercase;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      .s7-cursor {
        position: absolute;

      /* ---- BEAT 2: scarcity / bonus stacked reveal ---- */
      .s7-scarcity-eyebrow {

      .s7-scarcity-line2 {
        font-family: var(--font-display);
        font-weight: 400;
        font-size: 96px;
        line-height: 0.98;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        color: var(--brand-primary);
        max-width: 880px;
        margin-top: 36px;
        background: var(--canvas);
        border: var(--border-bold);
        box-shadow: var(--shadow-hard);
        padding: 24px 40px;
        z-index: 4;
      }

      /* ---- BEAT 3: PLACES LIMITÉES punch ---- */
      .s7-limit {
        font-family: var(--font-display);
        font-weight: 400;
        font-size: 150px;
        line-height: 0.92;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        color: var(--canvas);
        background: var(--brand-primary);
        border: var(--border-loud);
        box-shadow: var(--shadow-hard);
        padding: 40px 56px;
        max-width: 900px;
        transform-origin: 50% 50%;
        z-index: 5;
      }

      /* ---- BEAT 4: bicolor split end card ---- */
      .s7-endcard {
        z-index: 7;
      }
      .s7-split {
        position: absolute;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }
      .s7-split-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: var(--brand-secondary);
      }
      .s7-split-bot {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 50%;
        background: var(--brand-primary);
      }
      .s7-end-headline {
        position: relative;
        z-index: 2;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0 28px;
        width: 880px;
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 96px;
        line-height: 1.0;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--canvas);
      }
      .s7-flip-word {
        position: relative;
        display: inline-flex;
        white-space: nowrap;
      }
      .s7-flip-word .s7-ghost {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        pointer-events: none;
      }
      .s7-flip-row {
        position: relative;
        display: inline-flex;
      }
      .s7-flip-char {
        display: inline-block;
        transform-origin: bottom;
        transform-style: preserve-3d;
        will-change: transform, opacity;
      }
      .s7-end-rule {
        position: relative;
        z-index: 2;
        width: 360px;
        height: 8px;
        background: var(--canvas);
        margin: 46px 0;
        transform-origin: 50% 50%;
      }
      .s7-end-sign {
        position: relative;
        z-index: 2;
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 44px;
        line-height: 1.25;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--canvas);
        max-width: 860px;
      }
    </style>

    <!-- ambient base + corner pins (background layers) -->
    <div class="s7-grid-bg"></div>
    <span class="s7-corner s7-tl"></span>
    <span class="s7-corner s7-tr"></span>
    <span class="s7-corner s7-bl"></span>
    <span class="s7-corner s7-br"></span>

    <!-- BEAT 1: CTA button press (0 - 4.4s) -->
    <div class="s7-beat clip" id="s7-beat1" data-start="0" data-duration="4.4" data-track-index="0">
      <div class="s7-deco-yellow"></div>
      <div class="s7-deco-blue"></div>
      <div class="s7-eyebrow" id="s7-eyebrow">2026. C'EST MAINTENANT.</div>
      <button class="s7-cta-btn" id="s7-cta-btn">TÉLÉCHARGE MAINTENANT</button>
      <div class="s7-ripple" id="s7-ripple-1"></div>
      <div class="s7-ripple" id="s7-ripple-2"></div>
      <svg class="s7-cursor" id="s7-cursor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 2 L21 12 L12 13 L7 22 Z" fill="var(--canvas)" stroke="var(--ink)" stroke-width="1.8" />
      </svg>
    </div>

    <!-- BEAT 2: scarcity / bonus reveal (4 - 8.5s) -->
    <div class="s7-beat clip" id="s7-beat2" data-start="4" data-duration="4.5" data-track-index="1">
      <div class="s7-scarcity-eyebrow" id="s7-scar-eyebrow">PRIVILÈGE EXCLUSIF</div>
      <div class="s7-scarcity-line1" id="s7-scar-line1">LES 100 PREMIERS</div>
      <div class="s7-scarcity-line2" id="s7-scar-line2">CANAL PRIVÉ WHATSAPP</div>
    </div>

    <!-- BEAT 3: PLACES LIMITÉES punch (8.5 - 10.5s) -->
    <div class="s7-beat clip" id="s7-beat3" data-start="8.5" data-duration="2.0" data-track-index="2">
      <div class="s7-limit" id="s7-limit">PLACES LIMITÉES</div>
    </div>

    <!-- BEAT 4: bicolor split end card (10.5 - 14.53s) -->
    <div class="s7-beat s7-endcard clip" id="s7-beat4" data-start="10.5" data-duration="4.03" data-track-index="3">
      <div class="s7-split">
        <div class="s7-split-top" id="s7-split-top"></div>
        <div class="s7-split-bot" id="s7-split-bot"></div>
      </div>
      <div class="s7-end-headline" id="s7-end-headline">
        <span class="s7-flip-word" data-target="ACCÈS"></span>
        <span class="s7-flip-word" data-target="IMMÉDIAT"></span>
      </div>
      <div class="s7-end-rule" id="s7-end-rule"></div>
      <div class="s7-end-sign" id="s7-end-sign">TRANSFORME 2026 EN ANNÉE DE REVENUS</div>
    </div>

    <script>
      const EASE = {
        entry: "back.out(2.4)",
        emphasis: "expo.out",
        exit: "power4.in",
        drift: "sine.inOut",
      };
      const DUR = {
        snap: 0.18,
        med: 0.45,
        slow: 0.9,
      };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const W = 1080;
      const H = 1920;

      /* ===================== BEAT 1 — CTA press (0 - 4.4s) ===================== */
      // Eyebrow context in early
      tl.fromTo(
        "#s7-eyebrow",
        { opacity: 0, y: -24 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.emphasis },
        0.15,
      );
      // Button slam-pops in
      tl.fromTo(
        "#s7-cta-btn",
        { opacity: 0, scale: 0.6, y: 40 },
        { opacity: 1, scale: 1, y: 0, duration: DUR.slow, ease: EASE.entry },
        0.3,
      );
      // Pre-click glow pulse on the button (the one live slot before the press)
      tl.fromTo(
        "#s7-cta-btn",
        { boxShadow: "8px 8px 0 var(--ink)" },
        { boxShadow: "14px 14px 0 var(--ink)", duration: 0.5, ease: EASE.drift, yoyo: true, repeat: 1 },
        1.2,
      );

      // Cursor: hard-cut in off-target, then spring approach.
      // Button center is the composition center ≈ (540, 1010).
      const BTN_CX = 540;
      const BTN_CY = 1010;
      const CURSOR_LAND_X = BTN_CX + 70;   // offset landing — reads human
      const CURSOR_LAND_Y = BTN_CY + 36;
      gsap.set("#s7-cursor", { x: W + 120, y: H + 120, scale: 1 });
      tl.fromTo(
        "#s7-cursor",
        { opacity: 0 },
        { opacity: 1, duration: 0.008, ease: "none" },
        1.3,
      );
      const APPROACH_START = 1.35;
      const APPROACH_DUR = 1.1;
      const PRESS_DOWN_AT = APPROACH_START + APPROACH_DUR; // 2.45
      tl.to(
        "#s7-cursor",
        { x: CURSOR_LAND_X, y: CURSOR_LAND_Y, duration: APPROACH_DUR, ease: "power2.out" },
        APPROACH_START,
      );

      // Coordinated press-down: button + cursor compress in lockstep (single target array)
      const PRESS_DOWN_DUR = 0.16;
      tl.to(
        ["#s7-cta-btn", "#s7-cursor"],
        { scale: 0.9, duration: PRESS_DOWN_DUR, ease: "power3.out" },
        PRESS_DOWN_AT,
      );
      // Pressed-in shadow during compression
      tl.to(
        "#s7-cta-btn",
        { boxShadow: "3px 3px 0 var(--ink)", duration: PRESS_DOWN_DUR, ease: "power1.in" },
        PRESS_DOWN_AT,
      );

      // Stillness-before-climax: hold the pressed beat ~0.5s, then release
      const RELEASE_AT = PRESS_DOWN_AT + PRESS_DOWN_DUR + 0.5; // ~3.11
      tl.to(
        ["#s7-cta-btn", "#s7-cursor"],
        { scale: 1, duration: 0.5, ease: "back.out(2.0)" },
        RELEASE_AT,
      );
      tl.to(
        "#s7-cta-btn",
        { boxShadow: "8px 8px 0 var(--ink)", duration: 0.4, ease: "power2.out" },
        RELEASE_AT,
      );

      // cursor-click-ripple: rings burst from the click point at press-down
      tl.set(["#s7-ripple-1", "#s7-ripple-2"], { opacity: 1 }, PRESS_DOWN_AT);
      tl.to(
        ["#s7-ripple-1", "#s7-ripple-2"],
        { scale: 5, opacity: 0, duration: 0.7, ease: "power2.out", stagger: 0.09, immediateRender: false },
        PRESS_DOWN_AT,
      );

      /* ===================== BEAT 2 — scale-swap into scarcity (4 - 8.5s) ===================== */
      // Beat 1 primary exits first (handoff before new primary enters)
      tl.to(
        ["#s7-cta-btn", "#s7-eyebrow", "#s7-cursor"],
        { scale: 0.7, opacity: 0, duration: 0.35, ease: "power2.in" },
        3.95,
      );
      // Incoming scarcity headline pops via scale-swap (overlap creates morph illusion)
      tl.fromTo(
        "#s7-scar-line1",
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.8)" },
        4.2,
      );
      tl.fromTo(
        "#s7-scar-eyebrow",
        { opacity: 0, y: -18 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.emphasis },
        4.35,
      );
      // The privilege line reveals after line1 settles
      tl.fromTo(
        "#s7-scar-line2",
        { opacity: 0, y: 28, scale: 0.92 },
        { opacity: 1, y: 0, scale: 1, duration: DUR.med, ease: EASE.entry },
        4.95,
      );

      /* ===================== BEAT 3 — PLACES LIMITÉES punch (8.5 - 10.5s) ===================== */
      tl.to(
        ["#s7-scar-line1", "#s7-scar-line2", "#s7-scar-eyebrow"],
        { scale: 0.7, opacity: 0, duration: 0.3, ease: "power2.in" },
        8.45,
      );
      tl.fromTo(
        "#s7-limit",
        { opacity: 0, scale: 0.55 },
        { opacity: 1, scale: 1, duration: 0.55, ease: EASE.entry },
        8.65,
      );

      /* ===================== BEAT 4 — bicolor end card, hacker decode (10.5 - 14.53s) ===================== */
      tl.to(
        "#s7-limit",
        { scale: 0.7, opacity: 0, duration: 0.3, ease: "power2.in" },
        10.45,
      );

      // Build hacker-flip char spans for the headline words (deterministic glyph substitution)
      const GLYPHS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*";
      function pseudoGlyph(seed) {
        const h = ((seed * 9301 + 49297) % 233280) / 233280;
        return GLYPHS[Math.floor(h * GLYPHS.length)];
      }
      const flipChars = [];
      const flipWords = document.querySelectorAll("#s7-end-headline .s7-flip-word");
      flipWords.forEach((wordEl) => {
        const target = wordEl.dataset.target;
        wordEl.innerHTML = "";
        const ghost = document.createElement("span");
        ghost.className = "s7-ghost";
        ghost.textContent = target;
        wordEl.appendChild(ghost);
        const row = document.createElement("span");
        row.className = "s7-flip-row";
        for (const ch of target) {
          const span = document.createElement("span");
          span.className = "s7-flip-char";
          span.textContent = ch;
          span.dataset.target = ch;
          row.appendChild(span);
          flipChars.push(span);
        }
        wordEl.appendChild(row);
      });

      // Split-fill end card snaps in (background, hard arrival)
      tl.fromTo(
        "#s7-split-top",
        { yPercent: -100 },
        { yPercent: 0, duration: DUR.med, ease: EASE.emphasis },
        10.55,
      );
      tl.fromTo(
        "#s7-split-bot",
        { yPercent: 100 },
        { yPercent: 0, duration: DUR.med, ease: EASE.emphasis },
        10.55,
      );

      // hacker-flip-3d decode of "ACCÈS IMMÉDIAT"
      const FLIP_DURATION = 0.6;
      const CHAR_STAGGER = 0.05;
      const REVEAL_THRESHOLD = 0.6;
      const FLIP_START = 11.15;
      flipChars.forEach((el, i) => {
        const state = { p: 0 };
        el.style.opacity = 0;
        el.style.transform = "rotateX(90deg)";
        tl.to(
          state,
          {
            p: 1,
            duration: FLIP_DURATION,
            ease: "power3.out",
            onUpdate: () => {
              const progress = state.p;
              if (progress < REVEAL_THRESHOLD) {
                const flickerSeed = i * 1000 + Math.floor(progress * 100);
                el.textContent = pseudoGlyph(flickerSeed);
              } else {
                el.textContent = el.dataset.target;
              }
              const rotateX = 90 - progress * 90;
              el.style.transform = "rotateX(" + rotateX + "deg)";
              el.style.opacity = Math.min(1, progress * 2);
            },
          },
          FLIP_START + i * CHAR_STAGGER,
        );
      });

      // Signature line + rule reveal after the decode settles (payoff lands)
      tl.fromTo(
        "#s7-end-rule",
        { scaleX: 0, opacity: 0 },
        { scaleX: 1, opacity: 1, duration: DUR.med, ease: EASE.emphasis },
        12.55,
      );
      tl.fromTo(
        "#s7-end-sign",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry },
        12.8,
      );

      /* ===================== Macro camera — slow push-in onto the whole composition ===================== */
      tl.fromTo(
        "#root",
        { scale: 1 },
        { scale: 1.04, duration: 14.53, ease: "none" },
        0,
      );

      window.__timelines["scene_7"] = tl;
    </script>
  </div>
</template>
