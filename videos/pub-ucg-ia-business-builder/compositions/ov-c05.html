      <script>

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#c05-panel", { clipPath: "circle(0% at 50% 60%)" }, { clipPath: "circle(150% at 50% 60%)", duration: 0.5, ease: "power3.out" }, 0.3);

          tl.fromTo("#c05-stars svg", { autoAlpha: 0, scale: 0, rotation: -60 }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.3, stagger: 0.07, ease: "back.out(2.6)" }, 0.8);
          tl.fromTo("#c05-review", { autoAlpha: 0, y: 160, rotation: 3 }, { autoAlpha: 1, y: 0, rotation: 0, duration: 0.5, ease: "back.out(1.4)" }, 0.65);

          tl.fromTo("#c05-rev2", { autoAlpha: 0, y: 200, rotation: -3 }, { autoAlpha: 1, y: 0, rotation: -1.5, duration: 0.45, ease: "back.out(1.4)" }, 1.8);
          tl.fromTo("#c05-rev2", { scale: 1 }, { scale: 0.96, duration: 0.3, ease: "power2.out", immediateRender: false }, 2.75);
          tl.fromTo("#c05-rev3", { autoAlpha: 0, y: 200, rotation: 3 }, { autoAlpha: 1, y: 0, rotation: 1, duration: 0.45, ease: "back.out(1.4)" }, 2.8);
          tl.fromTo("#c05-sat .pill", { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, 3.7);
          tl.to(["#c05-k", "#c05-stars", "#c05-review", "#c05-rev2", "#c05-rev3", "#c05-sat"], { autoAlpha: 0, y: -160, duration: 0.35, ease: "power2.in", stagger: 0.03 }, 4.7);
          // 100 % d'avis positifs
          const proxy = { v: 0 };
          const num = document.getElementById("c05-num");
          tl.fromTo("#c05-ringwrap", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 5.0);

          for (let i = 0; i < 14; i++) {
            const d = document.createElement("div");

            burst.appendChild(d);
            const a = (i / 14) * Math.PI * 2;
            const r = 380 + (i % 3) * 60;
            tl.fromTo(d, { x: 0, y: 0, scale: 1.4, autoAlpha: 1 }, { x: Math.cos(a) * r, y: Math.sin(a) * r, scale: 0, autoAlpha: 0, duration: 0.8, ease: "power3.out" }, 6.22);
