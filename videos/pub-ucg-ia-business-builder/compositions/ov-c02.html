<!doctype html>
<html>
  <body>
    <template>
      <style>
        #ov-c02 { position: absolute; inset: 0; overflow: hidden; pointer-events: none; font-family: "Montserrat", sans-serif; }
        #c02-panel { background: #0b141a; }
        /* « Caméra » : la vraie capture en pixels natifs (1170×2532), déplacée/zoomée en bloc */
        #c02-cam { position: absolute; left: 0; top: 0; width: 1170px; height: 2532px; }
        #c02-shot { position: absolute; left: 0; top: 0; width: 1170px; height: 2532px; display: block; }
        #c02-marks { position: absolute; left: 0; top: 0; width: 1170px; height: 2532px; overflow: visible; }
        .c02-box { stroke-dasharray: 1; stroke-dashoffset: 1; }
        .c02-box { fill: none; stroke: #f2b33d; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
        #c02-glow { filter: drop-shadow(0 0 10px rgba(242, 179, 61, 0.85)); }
        #c02-label { position: absolute; left: 0; right: 0; top: 150px; display: flex; justify-content: center; }
        #c02-label .kicker { background: rgba(5,10,29,.9); padding: 14px 30px; border-radius: 999px; border: 2px solid rgba(242,179,61,.7); }
      </style>
      <div id="ov-c02" data-composition-id="ov-c02" data-width="1080" data-height="1920" data-duration="10.2">
        <div class="fs" id="c02-panel">
          <div id="c02-cam">
            <img id="c02-shot" src="assets/img/wa-chat-1.png" alt="" />
            <svg id="c02-marks" viewBox="0 0 1170 2532">
              <defs>
                <mask id="c02-mask" maskUnits="userSpaceOnUse" x="-2000" y="-2000" width="5170" height="6532">
                  <rect x="-2000" y="-2000" width="5170" height="6532" fill="#fff" />
                  <rect id="c02-hole" x="26" y="320" width="898" height="226" rx="40" fill="#000" />
                </mask>
              </defs>
              <rect id="c02-dim" x="-2000" y="-2000" width="5170" height="6532" fill="rgba(3,6,18,0.62)" mask="url(#c02-mask)" />
              <g id="c02-glow">
                <rect class="c02-box" id="c02-f1" x="26" y="320" width="898" height="226" rx="40" pathLength="1" />
                <rect class="c02-box" id="c02-f2" x="26" y="1887" width="842" height="232" rx="40" pathLength="1" />
              </g>
            </svg>
          </div>
        </div>
        <div id="c02-label"><div class="kicker">Message reçu de M. Élie</div></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // Cadrage : amène le point (fx, fy) de la capture au centre utile de l'écran, au zoom s
          const CX = 540, CY = 700;
          const cam = (fx, fy, s) => ({ x: CX - fx * s, y: CY - fy * s, scale: s });
          const hole = (x, y, w, h) => ({ attr: { x: x, y: y, width: w, height: h } });
          const draw = (sel, t, d) => tl.fromTo(sel, { strokeDasharray: 1, strokeDashoffset: 1 },
            { strokeDashoffset: 0, duration: d || 0.4, ease: "power2.inOut" }, t);

          tl.set("#c02-cam", { transformOrigin: "0 0" }, 0);
          tl.fromTo("#c02-panel", { clipPath: "circle(0% at 50% 8%)" }, { clipPath: "circle(150% at 50% 8%)", duration: 0.5, ease: "power3.out" }, 0);
          tl.fromTo("#c02-label", { autoAlpha: 0, y: -20 }, { autoAlpha: 1, y: 0, duration: 0.3 }, 0.2);
          tl.fromTo("#c02-dim", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35 }, 0.55);

          // Bulle 1 en entier : « Très bonne formation… bien agencé »
          tl.fromTo("#c02-cam", cam(585, 760, 0.923), { ...cam(475, 433, 1.12), duration: 0.6, ease: "power3.inOut" }, 0.4);
          draw("#c02-f1", 0.75, 0.6);
          tl.fromTo("#c02-cam", { scale: 1.12 }, { ...cam(475, 433, 1.17), duration: 2.9, ease: "sine.inOut", immediateRender: false }, 1.05);
          tl.fromTo("#c02-f1", { strokeWidth: 9 }, { strokeWidth: 14, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 3.35);

          // « Puis un peu plus bas » → on dézoome et on descend dans la conversation
          tl.to("#c02-dim", { autoAlpha: 0, duration: 0.3 }, 4.0);
          tl.to("#c02-f1", { autoAlpha: 0, duration: 0.3 }, 4.0);
          tl.to("#c02-cam", { ...cam(585, 760, 0.923), duration: 0.5, ease: "power2.inOut" }, 4.0);
          tl.to("#c02-cam", { ...cam(585, 1900, 0.923), duration: 0.9, ease: "power2.inOut" }, 4.55);

          // Bulle 2 en entier : « vraiment professionnel / à bas prix… fier de vous »
          tl.set("#c02-hole", { attr: { x: 26, y: 1887, width: 842, height: 232 } }, 5.45);
          tl.to("#c02-cam", { ...cam(447, 2003, 1.18), duration: 0.55, ease: "power3.inOut" }, 5.5);
          tl.to("#c02-dim", { autoAlpha: 1, duration: 0.3 }, 5.6);
          draw("#c02-f2", 5.95, 0.6);
          tl.fromTo("#c02-cam", { scale: 1.18 }, { ...cam(447, 2003, 1.24), duration: 3.9, ease: "sine.inOut", immediateRender: false }, 6.05);
          tl.fromTo("#c02-f2", { strokeWidth: 9 }, { strokeWidth: 14, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 8.3);
          tl.fromTo("#c02-f2", { strokeWidth: 9 }, { strokeWidth: 16, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 9.5);
          window.__timelines["ov-c02"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
