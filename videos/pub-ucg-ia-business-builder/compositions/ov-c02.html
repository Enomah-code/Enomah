<!doctype html>
<html>
  <body>
    <template>
      <style>
        #ov-c02 { position: absolute; inset: 0; overflow: hidden; pointer-events: none; font-family: "Montserrat", sans-serif; }
        #c02-ghost { top: 1480px; }
        /* stage : pulsations autour du centre utile ; rig : zoom/cadrage du téléphone */
        #c02-stage { position: absolute; inset: 0; }
        #c02-rig { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        #c02-phone { position: absolute; left: 150px; top: 170px; width: 780px; height: 1100px; border-radius: 72px;
          border: 14px solid #0d0f18; background: #0b141a; overflow: hidden;
          box-shadow: 0 0 0 3px rgba(242,179,61,.55), 0 40px 120px rgba(0,0,0,.6); }
        #c02-scroll { position: absolute; left: 0; top: 0; width: 752px; height: 1627px; }
        #c02-cam { position: absolute; left: 0; top: 0; width: 1170px; height: 2532px; }
        #c02-shot { position: absolute; left: 0; top: 0; width: 1170px; height: 2532px; display: block; }
        #c02-marks { position: absolute; left: 0; top: 0; width: 1170px; height: 2532px; overflow: visible; }
        .c02-box { fill: none; stroke: #f2b33d; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
        #c02-dim { opacity: 0; }
        #c02-glow { filter: drop-shadow(0 0 12px rgba(242, 179, 61, 0.9)); }
        #c02-label { position: absolute; left: 0; right: 0; top: 70px; display: flex; justify-content: center; }
        #c02-label .kicker { background: rgba(5,10,29,.9); padding: 14px 30px; border-radius: 999px; border: 2px solid rgba(242,179,61,.7); }
      </style>
      <div id="ov-c02" data-composition-id="ov-c02" data-width="1080" data-height="1920" data-duration="10.2">
        <div class="fs" id="c02-panel">
          <div class="fs-bg"></div>
          <div class="fs-grid" id="c02-grid"></div>
          <div class="fs-glow" id="c02-bglow"></div>
          <div class="ghost" id="c02-ghost">Avis · Avis · Avis</div>
          <div id="c02-stage">
            <div id="c02-rig">
              <div id="c02-phone">
                <div id="c02-scroll">
                  <div id="c02-cam">
                    <img id="c02-shot" src="assets/img/wa-chat-1.png" alt="" />
                    <svg id="c02-marks" viewBox="0 0 1170 2532">
                      <defs>
                        <mask id="c02-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1170" height="2532">
                          <rect x="0" y="0" width="1170" height="2532" fill="#fff" />
                          <rect id="c02-hole" x="26" y="320" width="898" height="226" rx="40" fill="#000" />
                        </mask>
                      </defs>
                      <rect id="c02-dim" x="0" y="0" width="1170" height="2532" fill="rgba(3,6,18,0.66)" mask="url(#c02-mask)" />
                      <g id="c02-glow">
                        <rect class="c02-box" id="c02-f1" x="26" y="320" width="898" height="226" rx="40" pathLength="1" />
                        <rect class="c02-box" id="c02-f2" x="26" y="1887" width="842" height="232" rx="40" pathLength="1" />
                      </g>
                    </svg>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div id="c02-label"><div class="kicker">Message reçu de M. Élie</div></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // Géométrie : écran du téléphone et échelle de la capture (1170 px → 752 px)
          const SX = 164, SY = 184, K = 752 / 1170, SCROLL_MAX = 1627 - 1072;
          const CX = 540, CY = 700;
          // Cadre le point (fx, fy) de la capture (px natifs) au centre utile, zoom S, pour un défilement donné
          const frame = (fx, fy, S, scroll) => {
            const px = SX + fx * K, py = SY + fy * K - scroll;
            return { x: CX - px * S, y: CY - py * S, scale: S };
          };
          const draw = (sel, t, d) => tl.fromTo(sel, { strokeDasharray: 1, strokeDashoffset: 1 },
            { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
          const punch = (t, amt, rot) => tl.fromTo("#c02-stage", { scale: 1, rotation: 0 },
            { scale: amt, rotation: rot, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t);

          tl.set("#c02-rig", { transformOrigin: "0 0" }, 0);
          tl.set("#c02-cam", { transformOrigin: "0 0", scale: K }, 0);
          tl.set("#c02-stage", { transformOrigin: CX + "px " + CY + "px", scale: 1, rotation: 0 }, 0);
          tl.fromTo("#c02-panel", { clipPath: "circle(0% at 50% 8%)" }, { clipPath: "circle(150% at 50% 8%)", duration: 0.45, ease: "power3.out" }, 0);
          tl.fromTo("#c02-grid", { y: 0 }, { y: 180, duration: 10.2, ease: "none" }, 0);
          tl.fromTo("#c02-ghost", { x: 0 }, { x: -700, duration: 10.2, ease: "none" }, 0);
          tl.fromTo("#c02-label", { autoAlpha: 0, y: -30 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "back.out(2)" }, 0.15);

          // Le téléphone arrive, la conversation défile jusqu'au message d'Élie
          tl.fromTo("#c02-phone", { y: 520, rotation: -7 }, { y: 0, rotation: 0, duration: 0.5, ease: "back.out(1.3)" }, 0.02);
          tl.fromTo("#c02-scroll", { y: -SCROLL_MAX }, { y: 0, duration: 0.75, ease: "power4.out" }, 0.1);

          // Zoom-punch sur la bulle 1 entière + cadre
          tl.fromTo("#c02-rig", { x: 0, y: 0, scale: 1 }, { ...frame(475, 433, 1.72, 0), duration: 0.42, ease: "back.out(1.3)" }, 0.6);
          tl.to("#c02-dim", { autoAlpha: 1, duration: 0.25 }, 0.75);
          draw("#c02-f1", 0.8, 0.5);
          punch(2.12, 1.05, 1.2);   // « pas novice »
          punch(3.45, 1.05, -1.2);  // « bien agencé »

          // « Puis un peu plus bas » : dézoom, vrai défilement WhatsApp (élan + rebond)
          tl.to(["#c02-dim", "#c02-f1"], { autoAlpha: 0, duration: 0.2 }, 3.95);
          tl.to("#c02-rig", { x: 0, y: 0, scale: 1, duration: 0.4, ease: "power3.inOut" }, 3.95);
          tl.to("#c02-scroll", { y: -(SCROLL_MAX + 45), duration: 0.8, ease: "power4.out" }, 4.4);
          tl.to("#c02-scroll", { y: -SCROLL_MAX, duration: 0.3, ease: "power2.out" }, 5.2);

          // Zoom-punch sur la bulle 2 entière + cadre
          tl.set("#c02-hole", { attr: { x: 26, y: 1887, width: 842, height: 232 } }, 5.4);
          tl.to("#c02-rig", { ...frame(447, 2003, 1.8, SCROLL_MAX), duration: 0.42, ease: "back.out(1.3)" }, 5.5);
          tl.to("#c02-dim", { autoAlpha: 1, duration: 0.25 }, 5.65);
          draw("#c02-f2", 5.85, 0.5);
          punch(6.7, 1.05, 1.2);    // « très professionnel »
          punch(8.3, 1.05, -1.2);   // « à bas prix »
          punch(9.55, 1.08, 1.5);   // « fier de vous »
          window.__timelines["ov-c02"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
