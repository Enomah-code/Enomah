    <script>
      (function () {
        const V = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const SIGNATURE_ENDCARD = V.SIGNATURE_ENDCARD !== false, SIGNATURE_WATERMARK = V.SIGNATURE_WATERMARK !== false;
        if (!SIGNATURE_ENDCARD) { document.getElementById("se-endcard").setAttribute("data-hidden", ""); document.getElementById("se-opener").setAttribute("data-hidden", ""); }
        const b = SE.beatGrid(105);   // 1 beat = 0.571 s
        const R = SE.prng(505);
        const T = 55, S0 = 2 / 3;
        const tl = gsap.timeline({ paused: true });
        const cam = (s, px, py, fx, fy) => { s = Math.max(s, S0); return { scale: s, x: Math.min(0, Math.max(1920 - 2880 * s, fx - s * px)), y: Math.min(0, Math.max(1080 - 1620 * s, fy - s * py)) }; };
        const FULL = { scale: S0, x: 0, y: 0 };
        const show = (id, a, z, fade) => { tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: fade || 0.45, ease: "sine.inOut", immediateRender: false }, a); if (z != null) tl.to(id, { opacity: 0, duration: fade || 0.45, ease: "sine.inOut" }, z); };

        /* ---------- kinetic label system (strictly identical for 01-04) ---------- */
        function label(sel, num, lines, sub, color, tIn, tOut) {
          const el = document.querySelector(sel);
          el.innerHTML = '<div class="num" style="color:' + (color.solid || color) + '">' + '<span class="nv">00</span></div><div class="bar" style="background:' + (color.bg || color) + '"></div><div class="ttl">' +
            lines.map((l) => '<span class="ln">' + l.split(" ").map((w) => '<span class="w">' + w + "</span>").join("") + "</span>").join("") + '</div><div class="sub">' + sub + "</div>";
          el.dataset.tin = tIn;
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, tIn);
          tl.fromTo(el.querySelector(".bar"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, tIn + 0.1);
          tl.fromTo(el.querySelectorAll(".w"), { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "power3.out", stagger: 0.06, immediateRender: false }, tIn + 0.25);
          tl.fromTo(el.querySelector(".sub"), { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, tIn + 0.25 + 0.06 * lines.join(" ").split(" ").length + 0.2);
          tl.to(el, { y: -60, opacity: 0, duration: 0.35, ease: "power2.in" }, tOut);
          el.dataset.num = num;
        }
        const nvFix = [];   // numbers are re-derived from time (seek-safe)

        /* ============ INTRO · 0 – 5 s ============ */
        tl.to("#ic-ring", { attr: { "stroke-dashoffset": 0 }, duration: 0.9, ease: "power2.inOut" }, 0.9);
        tl.to("#ic-fill", { attr: { opacity: 1 }, duration: 0.4, ease: "power2.out" }, 1.8);
        // the disc becomes the robot seen from above-front
        tl.to(["#ic-ring", "#ic-fill"], { attr: { r: 120 }, opacity: 0, duration: 0.6, ease: "expo.inOut" }, 2.3);
        tl.fromTo("#intro-robot", { opacity: 0, scale: 0.35, y: 60 }, { opacity: 1, scale: 0.62, y: 60, duration: 0.7, ease: "expo.out", immediateRender: false }, 2.4);
        tl.fromTo("#brand", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 3.2);
        tl.to("#intro-robot", { y: 40, duration: 1.4, ease: "sine.inOut" }, 3.1);
        // robot grows to its exact place in the photograph, then the studio appears behind it
        tl.to("#intro-robot", { scale: 1, y: 0, duration: 0.8, ease: "expo.inOut" }, 4.35);
        tl.to("#brand", { opacity: 0, y: -20, duration: 0.4, ease: "power2.in" }, 4.3);
        show("#s-hero", 5.0, null, 0.5);
        tl.to("#s-intro", { opacity: 0, duration: 0.3 }, 5.5);

        /* ============ OVERVIEW · 5 – 10 s ============ */
        gsap.set("#hero", FULL);
        tl.to("#hero", Object.assign({ duration: 5.0, ease: "sine.inOut" }, cam(0.74, 1440, 850, 960, 560)), 5.0);
        tl.fromTo("#sweep", { x: 0 }, { x: 4200, duration: 1.4, ease: "power2.inOut", immediateRender: false }, 5.6);
        const clSvg = document.getElementById("cl-svg");
        const CL = [["c1", [1335, 250], [1080, 120]], ["c2", [1520, 420], [1560, 330]], ["c3", [1500, 870], [1580, 900]], ["c4", [640, 920], [420, 920]]];
        CL.forEach(([id, a, d], i) => {
          clSvg.insertAdjacentHTML("beforeend", '<g id="' + id + '-g"><circle cx="' + a[0] + '" cy="' + a[1] + '" r="7" /><path d="M' + a[0] + " " + a[1] + " L" + d[0] + " " + d[1] + '" /></g>');
          const t = 6.2 + i * b(1);
          const p = clSvg.querySelector("#" + id + "-g path"), len = p.getTotalLength();
          tl.fromTo(p, { attr: { "stroke-dasharray": len, "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power3.out", immediateRender: false }, t);
          tl.fromTo(clSvg.querySelector("#" + id + "-g circle"), { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.25, ease: "back.out(2)", immediateRender: false }, t);
          tl.fromTo("#" + id, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, t + 0.25);
        });
        gsap.set("#cl-svg g", { opacity: 1 });
        tl.fromTo("#ov-title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 6.0);
        tl.to(["#cl-svg", ".callout", "#ov-title"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 9.4);
        tl.to("#s-hero", { opacity: 0, duration: 0.45, ease: "sine.inOut" }, 9.7);

        /* ============ 01 · LiDAR · 10 – 20 s ============ */
        show("#s-lidar", 9.8, 19.7);
        const walls = [
          "M60 60 L1040 60", "M1040 60 L1040 840", "M1040 840 L60 840", "M60 840 L60 60",
          "M560 60 L560 380", "M560 520 L560 840", "M60 460 L420 460", "M800 60 L800 300", "M800 420 L1040 420"
        ];
        const wg = document.getElementById("walls");
        walls.forEach((d, i) => wg.insertAdjacentHTML("beforeend", '<path class="wall" id="wl' + i + '" d="' + d + '" />'));
        wg.insertAdjacentHTML("beforeend", '<text class="room-lb" x="120" y="120">SALON</text><text class="room-lb" x="120" y="520">CUISINE</text><text class="room-lb" x="600" y="120">CHAMBRE</text><text class="room-lb" x="840" y="470">ENTRÉE</text>');
        wg.querySelectorAll(".wall").forEach((w, i) => {
          const len = w.getTotalLength();
          tl.fromTo(w, { attr: { "stroke-dasharray": len, "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "power2.out", immediateRender: false }, 10.8 + i * 0.42);
        });
        tl.fromTo(".room-lb", { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.3, immediateRender: false }, 13.4);
        // serpentine cleaning route in the living room (drawn as the robot drives it)
        let sp = "M110 110"; for (let r = 0; r < 7; r++) { const y = 110 + r * 48; sp += (r % 2 ? " L110 " : " L500 ") + y + " L" + (r % 2 ? 110 : 500) + " " + (y + 48); }
        const pathS = document.getElementById("path-s"); pathS.setAttribute("d", sp);
        const pl = pathS.getTotalLength();
        gsap.set(pathS, { attr: { "stroke-dasharray": pl, "stroke-dashoffset": pl } });
        const scanner = document.getElementById("scanner");
        label("#k1", 1, ["Navigation", "LiDAR 360°"], "Cartographie en 1 passage", "#3ce6b0", 11.4, 19.1);

        /* ============ 02 · suction · 20 – 30 s ============ */
        show("#s-suck", 19.8, 29.7);
        gsap.set("#close", FULL);
        tl.fromTo("#close", cam(0.7, 1700, 700, 1100, 520), Object.assign({ duration: 9.9, ease: "sine.inOut", immediateRender: false }, cam(0.86, 1600, 760, 1120, 560)), 19.8);
        const dustf = document.getElementById("dustf"), dust = [];
        for (let i = 0; i < 220; i++) {
          const d = document.createElement("div"); d.className = "dustp";
          const r = 2 + R() * 5; d.style.width = d.style.height = 2 * r + "px";
          dustf.appendChild(d); dust.push({ el: d, a: R() * Math.PI * 2, rad: 220 + R() * 700, ph: R(), sp: 0.5 + R() * 1.2 });
        }
        tl.fromTo("#pa", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 21.2);
        label("#k2", 2, ["Aspiration", "8 000 Pa"], "Tapis profonds, sols durs", { solid: "#7aa7ff", bg: "#7aa7ff" }, 21.4, 29.1);

        /* ============ 03 · station · 30 – 40 s ============ */
        show("#s-dock", 29.8, 39.7);
        tl.fromTo("#dock-lines path", { attr: { "stroke-dasharray": 2600, "stroke-dashoffset": 2600 } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.2, ease: "power2.inOut", stagger: 0.15, immediateRender: false }, 30.2);
        // robot follows a soft curve into the dock
        const DR = (t) => { const p = Math.min(1, Math.max(0, t)); const e = p * p * (3 - 2 * p); return { x: -300 + e * 1110 + Math.sin(e * Math.PI) * 60, y: 700 - Math.sin(e * Math.PI) * 180 - e * 40, s: 0.55 + e * 0.12, r: -10 + e * 10 }; };
        tl.fromTo("#flow", { opacity: 0, attr: { "stroke-dashoffset": 0 } }, { opacity: 1, attr: { "stroke-dashoffset": -216 }, duration: 3, ease: "none", immediateRender: false }, 33.8);
        tl.to("#flow", { opacity: 0, duration: 0.3 }, 36.8);
        tl.fromTo("#bag-fill", { attr: { height: 0, y: 460 } }, { attr: { height: 150, y: 310 }, duration: 3, ease: "power1.inOut", immediateRender: false }, 33.8);
        tl.fromTo("#days", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 35.2);
        label("#k3", 3, ["Auto-vidage", "60 jours"], "Le sac se remplit, pas vous", { solid: "#5ccfe0", bg: "linear-gradient(90deg,#3ce6b0,#7aa7ff)" }, 31.4, 39.1);

        /* ============ 04 · app · 40 – 48 s ============ */
        show("#s-app", 39.8, 47.8);
        const PS = 0.64;
        gsap.set("#phone-wrap", { scale: PS, x: 90, y: 30 });
        tl.fromTo("#phone-wrap", { y: 120, rotation: -3 }, { y: 30, rotation: 0, duration: 0.8, ease: "power3.out", immediateRender: false }, 39.9);
        // map app mapped onto the screen by homography
        function homography(w, h, Q) {
          const src = [[0, 0], [w, 0], [w, h], [0, h]]; const A = [], B = [];
          for (let i = 0; i < 4; i++) { const [x, y] = src[i], [u, v] = Q[i]; A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); B.push(u); A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); B.push(v); }
          for (let c = 0; c < 8; c++) { let p = c; for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r; [A[c], A[p]] = [A[p], A[c]]; [B[c], B[p]] = [B[p], B[c]];
            for (let r = 0; r < 8; r++) if (r !== c) { const f = A[r][c] / A[c][c]; for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k]; B[r] -= f * B[c]; } }
          const H = B.map((v, i) => v / A[i][i]);
          return "matrix3d(" + [H[0], H[3], 0, H[6], H[1], H[4], 0, H[7], 0, 0, 1, 0, H[2], H[5], 0, 1].map((n) => n.toFixed(8)).join(",") + ")";
        }
        const app = document.getElementById("app");
        app.style.transform = homography(750, 1350, [[268.4, 284.0], [818.4, 284.0], [830.4, 1275.2], [276.0, 1275.2]]);
        app.innerHTML =
          '<div style="position:absolute;left:40px;top:50px;font:800 44px Manrope;color:#fff;">Ma maison</div>' +
          '<div style="position:absolute;left:40px;top:108px;font:500 26px Manrope;color:#8394ab;">Orbis R9 · Batterie 96 %</div>' +
          '<svg viewBox="0 0 670 700" style="position:absolute;left:40px;top:180px;width:670px;height:700px;">' +
            '<rect x="10" y="10" width="650" height="680" rx="18" fill="#132338" stroke="#2c4260" stroke-width="4"/>' +
            '<rect id="room-lv" x="24" y="24" width="360" height="330" rx="10" fill="#1d3552"/>' +
            '<rect x="398" y="24" width="248" height="330" rx="10" fill="#172b44"/><rect x="24" y="368" width="300" height="308" rx="10" fill="#172b44"/><rect x="338" y="368" width="308" height="308" rx="10" fill="#172b44"/>' +
            '<text x="44" y="64" style="font:800 24px Manrope;fill:#cfe0f5;">Salon</text><text x="418" y="64" style="font:500 22px Manrope;fill:#8394ab;">Chambre</text><text x="44" y="408" style="font:500 22px Manrope;fill:#8394ab;">Cuisine</text><text x="358" y="408" style="font:500 22px Manrope;fill:#8394ab;">Bureau</text>' +
            '<path id="app-trail" d="" fill="none" stroke="#3ce6b0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>' +
            '<g id="app-bot"><circle r="22" fill="#fafafa" stroke="#3ce6b0" stroke-width="5"/><circle r="6" fill="#111418"/></g>' +
          '</svg>' +
          '<div id="app-btn" style="position:absolute;left:40px;right:40px;top:930px;height:130px;border-radius:65px;background:#3ce6b0;color:#0e1a2b;display:grid;place-items:center;font:800 38px Manrope;">Nettoyer le salon</div>' +
          '<div id="app-tapc" style="position:absolute;left:325px;top:945px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,0.6);opacity:0;"></div>' +
          '<div id="app-state" style="position:absolute;left:40px;right:40px;top:1100px;text-align:center;font:500 28px Manrope;color:#8394ab;">Prêt</div>';
        app.querySelectorAll("*").forEach((e) => e.setAttribute("data-layout-allow-overlap", ""));
        tl.fromTo("#app-tapc", { opacity: 0.9, scale: 0.2 }, { opacity: 0, scale: 1.8, duration: 0.5, ease: "power2.out", immediateRender: false }, 42.3);
        tl.fromTo("#app-btn", { scale: 1 }, { scale: 0.95, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.inOut", immediateRender: false }, 42.3);
        tl.fromTo("#room-card", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 40.3);
        tl.fromTo("#room-lv", { attr: { fill: "#1d3552" } }, { attr: { fill: "#1f4f55" }, duration: 0.4, immediateRender: false }, 42.4);
        label("#k4", 4, ["Pilotage", "intelligent"], "Une pièce, un geste", "#3ce6b0", 40.6, 47.2);

        /* ============ RECAP · 48 – 55 s ============ */
        show("#s-recap", 47.9, 51.3);
        const RC = [["r1", "01", "Navigation LiDAR", "Carte en 1 passage", "#3ce6b0"], ["r2", "02", "8 000 Pa", "Aspiration puissante", "#7aa7ff"], ["r3", "03", "Auto-vidage", "60 jours d’autonomie", "#5ccfe0"], ["r4", "04", "Pilotage", "Depuis l’application", "#3ce6b0"]];
        const icons = {
          r1: '<circle cx="55" cy="55" r="16" fill="none" stroke="CLR" stroke-width="6"/><path d="M55 55 L100 40 A48 48 0 0 1 100 70 Z" fill="CLR" opacity="0.5"/>',
          r2: '<path d="M55 20 C80 20 90 45 70 55 C50 65 60 90 85 88 M55 20 C30 20 20 45 40 55 C60 65 50 90 25 88" fill="none" stroke="CLR" stroke-width="6" stroke-linecap="round"/>',
          r3: '<rect x="25" y="15" width="60" height="80" rx="10" fill="none" stroke="CLR" stroke-width="6"/><path d="M40 70 L70 70" stroke="CLR" stroke-width="6" stroke-linecap="round"/>',
          r4: '<rect x="32" y="10" width="46" height="90" rx="10" fill="none" stroke="CLR" stroke-width="6"/><circle cx="55" cy="85" r="5" fill="CLR"/>'
        };
        RC.forEach(([id, n, t, s, c], i) => {
          document.getElementById(id).innerHTML = '<svg class="ic" viewBox="0 0 110 110">' + icons[id].replace(/CLR/g, c) + '</svg><div class="t">' + t + '</div><div class="s">' + s + "</div>";
          tl.fromTo("#" + id, { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, 48.2 + i * 0.12);
        });
        // morph: the grid collapses into the hero robot
        tl.to(".tile", { scale: 0.6, opacity: 0, duration: 0.5, ease: "power2.in", stagger: 0.05 }, 51.0);
        tl.set("#hero", FULL, 51.0);
        tl.set(["#cl-svg", ".callout", "#ov-title"], { opacity: 0 }, 51.0);
        show("#s-hero", 51.2, null, 0.6);
        tl.to("#hero", Object.assign({ duration: 3.8, ease: "sine.inOut" }, cam(0.72, 1500, 900, 1250, 560)), 51.2);
        tl.fromTo("#outro-text", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 51.9);
        if (SIGNATURE_WATERMARK && SIGNATURE_ENDCARD) tl.fromTo("#watermark", { opacity: 0 }, { opacity: 0.3, duration: 0.4, immediateRender: false }, 53.0);

        /* ---------- time-driven visuals (pure function of the playhead) ---------- */
        const ss = (p) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, p)));
        const trail = document.getElementById("app-trail"), abot = document.getElementById("app-bot"), astate = document.getElementById("app-state");
        let tp = "M60 70"; for (let r = 0; r < 6; r++) { const y = 70 + r * 48; tp += (r % 2 ? " L60 " : " L340 ") + y + " L" + (r % 2 ? 60 : 340) + " " + (y + 48); }
        trail.setAttribute("d", tp);
        const tlen = trail.getTotalLength();
        const pa = document.getElementById("pa-v"), days = document.getElementById("days-v"), pulse = document.getElementById("pulse");
        function state() {
          const t = tl.time();
          // LiDAR: scanner sweeps, then drives the serpentine
          const drive = ss((t - 15.0) / 3.6);
          const pt = pathS.getPointAtLength(pl * drive);
          const sx = t < 15 ? 330 : pt.x, sy = t < 15 ? 260 : pt.y;
          scanner.setAttribute("transform", "translate(" + sx + " " + sy + ")");
          document.getElementById("ray").setAttribute("transform", "rotate(" + ((t - 10) * 220) % 360 + ")");
          document.getElementById("ray").style.opacity = t < 14.9 ? 1 : Math.max(0, 1 - (t - 14.9) * 2);
          pathS.style.strokeDashoffset = pl * (1 - drive);
          // suction: particles spiral into the intake, accelerating toward the centre
          const cx = 1080, cy = 760;
          const k = Math.min(1, Math.max(0, (t - 21.0) / 6));
          dust.forEach((d) => {
            const life = ((t - 21) * d.sp + d.ph) % 1;
            const rr = t < 21 ? d.rad : d.rad * Math.pow(1 - life, 1.6) * (1 - 0.25 * k);
            const ang = d.a + (t < 21 ? 0 : life * 5.5);
            d.el.style.transform = "translate(" + (cx + Math.cos(ang) * rr) + "px," + (cy + Math.sin(ang) * rr * 0.45) + "px)";
            d.el.style.opacity = t < 20.5 ? 0 : (t > 28 ? Math.max(0, 1 - (t - 28)) : 1) * Math.min(1, rr / 60);
          });
          pa.textContent = t < 21.4 ? "0" : Math.round(8000 * ss((t - 21.4) / 2.2)).toLocaleString("fr-FR").replace(/ | /g, " ");
          // station: robot drives into the dock
          const dp = DR((t - 31.6) / 1.8);
          gsap.set("#dock-robot", { x: dp.x, y: dp.y - 228, scale: dp.s, rotation: dp.r });
          days.textContent = t < 35.2 ? "0" : Math.round(60 * ss((t - 35.2) / 1.6));
          // app: robot on the map and the real one pulse together
          const ap = ss((t - 42.6) / 4.2);
          const q = trail.getPointAtLength(tlen * ap);
          abot.setAttribute("transform", "translate(" + q.x + " " + q.y + ")");
          trail.style.strokeDasharray = tlen; trail.style.strokeDashoffset = tlen * (1 - ap);
          astate.textContent = t < 42.4 ? "Prêt" : t < 46.9 ? "Nettoyage du salon… " + Math.round(ap * 100) + " %" : "Salon propre ✓";
          const ph = ((t - 42.6) % 1.2) / 1.2;
          pulse.style.opacity = t < 42.6 || t > 47.4 ? 0 : (1 - ph) * 0.9;
          pulse.style.transform = "translate(" + (402 - 100) + "px," + (410 - 45) + "px) scale(" + (0.8 + ph * 1.4) + ")";
          // label numbers
          document.querySelectorAll(".kl").forEach((el) => {
            const n = +el.dataset.num, t0 = +el.dataset.tin;
            el.querySelector(".nv").textContent = "0" + Math.min(n, Math.max(0, Math.floor((t - t0) / 0.3 * (n + 1))));
          });
        }
        tl.eventCallback("onUpdate", state); state();

        const host = document.getElementById("orbis");
        SE.addVignette(host, 0.22, "14,26,43");
        SE.addGrain(host, tl, { opacity: 0.04, duration: T, fps: 30, blend: "overlay", seed: 5 });
        window.__timelines["main"] = tl;
      })();
    </script>
