<!doctype html>
<html
  lang="fr"
  data-composition-variables='[
    {"id":"logoPct","type":"number","label":"Largeur du logo (% de l image)","default":22,"min":8,"max":40,"step":1}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <title>Stone Edits — carte de fin</title>
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 400; font-display: block; src: url('assets/fonts/montserrat-400.woff2') format('woff2'); }
        @font-face { font-family: 'Montserrat'; font-style: normal; font-weight: 800; font-display: block; src: url('assets/fonts/montserrat-800.woff2') format('woff2'); }
        #se-endcard {
          position: absolute;
          inset: 0;
          background: #0a0a0a;
          container-type: size;
          overflow: hidden;
          font-family: 'Montserrat', sans-serif;
        }
        #se-endcard .se-stack {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          --lw: calc(var(--logoPct, 22) * 1cqw);
        }
        #se-endcard .se-logo {
          display: block;
          width: var(--lw);
          height: calc(var(--lw) * 420 / 396);
          overflow: visible;
        }
        #se-endcard .se-name {
          margin-top: calc(var(--lw) * 0.2);
          color: #ffffff;
          font-weight: 800;
          font-size: calc(var(--lw) * 0.19);
          line-height: 1;
          letter-spacing: 0.18em;
          padding-left: 0.18em;
          white-space: nowrap;
        }
        #se-endcard .se-name span { display: inline-block; }
        #se-endcard .se-sub {
          margin-top: calc(var(--lw) * 0.075);
          color: rgba(255, 255, 255, 0.6);
          font-weight: 400;
          font-size: calc(var(--lw) * 0.075);
          line-height: 1;
          letter-spacing: 0.3em;
          padding-left: 0.3em;
          white-space: nowrap;
        }
        #se-endcard .se-black {
          position: absolute;
          inset: 0;
          background: #0a0a0a;
          opacity: 0;
        }
      </style>

      <div id="se-endcard" data-composition-id="se-endcard" data-width="{{W}}" data-height="{{H}}" data-duration="1.5">
        <div class="se-stack">
          <svg class="se-logo" viewBox="0 0 396 420" aria-label="Stone Edits">
            <defs>
              <linearGradient id="se-gold" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#8C6A24" />
                <stop offset="0.5" stop-color="#C9A44C" />
                <stop offset="1" stop-color="#F1D58A" />
              </linearGradient>
              <radialGradient id="se-glint-g">
                <stop offset="0" stop-color="#FFF6DA" stop-opacity="1" />
                <stop offset="0.35" stop-color="#F1D58A" stop-opacity="0.7" />
                <stop offset="1" stop-color="#C9A44C" stop-opacity="0" />
              </radialGradient>
              <!-- sheen band travels perpendicular to the blade, at the blade angle -->
              <linearGradient id="se-sheen-g" gradientUnits="userSpaceOnUse" x1="-60" y1="-60" x2="60" y2="60">
                <stop offset="0" stop-color="#F1D58A" stop-opacity="0" />
                <stop offset="0.45" stop-color="#F1D58A" stop-opacity="0.85" />
                <stop offset="0.5" stop-color="#FFF3CF" stop-opacity="1" />
                <stop offset="0.55" stop-color="#C9A44C" stop-opacity="0.85" />
                <stop offset="1" stop-color="#8C6A24" stop-opacity="0" />
              </linearGradient>
              <clipPath id="se-letters-clip">
                <path transform="{{TR}}" d="{{S}}" />
                <path transform="{{TR}}" d="{{E}}" />
              </clipPath>
            </defs>

            <g id="se-s-wrap"><path id="se-s" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" transform="{{TR}}" d="{{S}}" /></g>
            <g id="se-e-wrap"><path id="se-e" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" transform="{{TR}}" d="{{E}}" /></g>

            <g clip-path="url(#se-letters-clip)">
              <rect id="se-sheen" x="-60" y="-60" width="120" height="120" fill="url(#se-sheen-g)" transform="translate(-60 -60) scale(1)" opacity="0" />
            </g>

            <g id="se-shake">
              <g id="se-bl-lo">
                <path class="se-bw" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" transform="{{TR}}" d="{{BLADE_LO}}" opacity="0" />
                <path class="se-bg" fill="url(#se-gold)" stroke="#C9A44C" stroke-width="18" stroke-linejoin="round" transform="{{TR}}" d="{{BLADE_LO}}" />
              </g>
              <g id="se-bl-hi">
                <path class="se-bw" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" transform="{{TR}}" d="{{BLADE_HI}}" opacity="0" />
                <path class="se-bg" fill="url(#se-gold)" stroke="#C9A44C" stroke-width="18" stroke-linejoin="round" transform="{{TR}}" d="{{BLADE_HI}}" />
              </g>
              <g id="se-sparks"></g>
            </g>
            <circle id="se-glint" cx="198" cy="214" r="60" fill="url(#se-glint-g)" opacity="0" />
          </svg>
          <div class="se-name" id="se-name"></div>
          <div class="se-sub" id="se-sub">MOTION &amp; EDIT</div>
        </div>
        <div class="se-black" id="se-black"></div>

        <audio id="se-sfx-shing" src="assets/sfx/whoosh-short.mp3" data-start="0" data-duration="0.6" data-track-index="20" data-volume="0.55"></audio>
        <audio id="se-sfx-ping" src="assets/sfx/ping.mp3" data-start="0.12" data-duration="1.2" data-track-index="21" data-volume="0.35"></audio>
        <audio id="se-sfx-impact" src="assets/sfx/impact-bass-1.mp3" data-start="0.62" data-duration="0.85" data-track-index="22" data-volume="0.3"></audio>
      </div>

      <script>
        (function () {
          // Blade axis in logo viewBox units (lower-left tip -> upper-right tip).
          const A = { x: 10, y: 388 }, B = { x: 378, y: 36 };
          const tl = gsap.timeline({ paused: true });

          // 1. 0.00-0.25 : the two blade pieces rush in along the cut from opposite corners and clash
          const U = { x: 0.722, y: -0.692 }, D0 = 230, HIT = 0.17;
          tl.fromTo("#se-bl-lo", { x: -U.x * D0, y: -U.y * D0, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: HIT, ease: "power4.in" }, 0);
          tl.fromTo("#se-bl-hi", { x: U.x * D0, y: U.y * D0, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: HIT, ease: "power4.in" }, 0);
          tl.fromTo("#se-glint", { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1.4, duration: 0.05, ease: "power2.out" }, HIT);
          tl.to("#se-glint", { opacity: 0, scale: 2.2, duration: 0.3, ease: "power2.out" }, HIT + 0.05);
          tl.fromTo("#se-shake", { x: 0, y: 0 }, { keyframes: [{ x: 5, y: -3, duration: 0.033 }, { x: -4, y: 4, duration: 0.033 }, { x: 2, y: -2, duration: 0.033 }, { x: 0, y: 0, duration: 0.033 }], ease: "none" }, HIT);
          (function sparks() {
            let s = 23 >>> 0;
            const r = () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
            const g = document.getElementById("se-sparks");
            for (let i = 0; i < 16; i++) {
              const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
              const len = 10 + r() * 22, ang = (r() < 0.5 ? 46 : 226) + (r() - 0.5) * 120, dist = 40 + r() * 90;
              ln.setAttribute("x1", 198); ln.setAttribute("y1", 214); ln.setAttribute("x2", 198 + len); ln.setAttribute("y2", 214);
              ln.setAttribute("stroke", i % 3 ? "#F1D58A" : "#FFF6DA"); ln.setAttribute("stroke-width", 2.2); ln.setAttribute("stroke-linecap", "round");
              ln.setAttribute("opacity", 0);
              g.appendChild(ln);
              const rad = ang * Math.PI / 180;
              tl.fromTo(ln, { opacity: 1, rotation: ang, svgOrigin: "198 214", x: 0, y: 0 },
                { x: Math.cos(rad) * dist, y: Math.sin(rad) * dist, opacity: 0, duration: 0.25 + r() * 0.2, ease: "power3.out", immediateRender: false }, HIT + r() * 0.03);
            }
          })();

          // 2. 0.25-0.70 : S and E slide in from opposite corners along the cut and meet
          tl.fromTo("#se-s-wrap", { x: -118, y: -92, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, 0.25);
          tl.fromTo("#se-e-wrap", { x: 118, y: 92, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, 0.25);
          // simulated motion blur for the first 3 frames of travel
          tl.fromTo(["#se-s-wrap", "#se-e-wrap"], { filter: "blur(5px)" }, { filter: "blur(0px)", duration: 0.12, ease: "power2.out" }, 0.25);

          // 3. 0.70-0.95 : gold sheen crosses the letters at the blade angle; blade returns to white
          tl.set("#se-sheen", { opacity: 1 }, 0.7);
          tl.fromTo("#se-sheen", { x: -40, y: -40, scale: 3.2, transformOrigin: "0px 0px" }, { x: 430, y: 450, duration: 0.25, ease: "sine.inOut" }, 0.7);
          tl.set("#se-sheen", { opacity: 0 }, 0.95);
          tl.to("#se-endcard .se-bw", { opacity: 1, duration: 0.2, ease: "power1.inOut" }, 0.72);
          tl.to("#se-endcard .se-bg", { opacity: 0, duration: 0.2, ease: "power1.inOut" }, 0.75);

          // 4. 0.95-1.50 : STONE EDITS tracks in (+40% -> +18%), then MOTION & EDIT, fade to black
          // tracking +40% -> +18%: glyphs are spread apart with x and settle into the +18% layout
          const name = document.getElementById("se-name");
          const txt = "STONE EDITS";
          name.textContent = "";
          const glyphs = [];
          for (const ch of txt) {
            const sp = document.createElement("span");
            sp.textContent = ch === " " ? "\u00a0" : ch;
            name.appendChild(sp);
            glyphs.push(sp);
          }
          const fs = parseFloat(getComputedStyle(name).fontSize) || 40;
          const extra = 0.22 * fs; // +22% of the em per glyph gap
          const mid = (glyphs.length - 1) / 2;
          glyphs.forEach((g, i) => {
            tl.fromTo(g, { x: (i - mid) * extra }, { x: 0, duration: 0.45, ease: "power3.out" }, 0.9);
          });
          tl.fromTo(name, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0.9);
          tl.fromTo("#se-sub", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out" }, 1.05);
          tl.fromTo("#se-black", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.in" }, 1.36);

          window.__timelines["se-endcard"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
