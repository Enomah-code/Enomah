    </style>

    <script>
      (function () {
        const V = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const SIGNATURE_ENDCARD = V.SIGNATURE_ENDCARD !== false;
        const SIGNATURE_WATERMARK = V.SIGNATURE_WATERMARK !== false;
        if (!SIGNATURE_ENDCARD) { document.getElementById("se-endcard").setAttribute("data-hidden", ""); document.getElementById("se-opener").setAttribute("data-hidden", ""); }
        const b = SE.beatGrid(100); // 1 beat = 0.6 s
        const R = SE.prng(404);
        const T = 22;
        const S0 = 1080 / 1300;
        const tl = gsap.timeline({ paused: true });
        const cam = (s, px, py, fx, fy) => {
          s = Math.max(s, 1080 / 1300);
          const x = Math.min(0, Math.max(1080 - 1300 * s, fx - s * px));
          const y = Math.min(0, Math.max(1920 - 2311 * s, fy - s * py));
          return { scale: s, x, y };
        };
        const FULL = { scale: S0, x: 0, y: 0 };
        gsap.set("#scene", FULL);

        /* ---------- generated particles (seeded) ---------- */
        const burners = [[320, 1650], [820, 1420], [1220, 2040]];
        const foam = document.getElementById("foam"), bubs = [];
        for (let i = 0; i < 420; i++) {
          const c = burners[i % 3];
          const d = document.createElement("div"); d.className = "bub";
          const r = 4 + Math.pow(R(), 2.2) * 26, ang = R() * Math.PI * 2, rad = Math.pow(R(), 0.8) * 260;
          const x = c[0] + Math.cos(ang) * rad, y = c[1] + Math.sin(ang) * rad * 0.45;
          d.style.cssText += "left:" + (x - r) + "px;top:" + (y - r * 0.62) + "px;width:" + 2 * r + "px;height:" + (2 * r * 0.62) + "px;opacity:0;";
          foam.appendChild(d); bubs.push(d);
        }
        const mf = document.getElementById("mistfield"), mists = [];
        for (let i = 0; i < 360; i++) {
          const d = document.createElement("div"); d.className = "mist";
          const r = 3 + R() * 9; d.style.width = d.style.height = 2 * r + "px"; d.style.marginLeft = d.style.marginTop = -r + "px"; d.style.opacity = 0;
          mf.appendChild(d); mists.push({ el: d, r });
        }
        const sp = document.getElementById("sparks"), sparks = [];
        const star = '<svg viewBox="-30 -30 60 60"><path d="M0 -28 C3 -6 6 -3 28 0 C6 3 3 6 0 28 C-3 6 -6 3 -28 0 C-6 -3 -3 -6 0 -28 Z" fill="#fff"/><circle r="5" fill="#fff"/></svg>';
        for (let i = 0; i < 26; i++) {
          const d = document.createElement("div"); d.className = "spark"; d.innerHTML = star;
          const c = burners[i % 3];
          d.style.left = (c[0] + (R() - 0.5) * 560) + "px"; d.style.top = (c[1] + (R() - 0.5) * 300) + "px";
          sp.appendChild(d); sparks.push(d);
        }
        // water beads on the bottle (packshot)
        const drops = document.getElementById("drops");
        for (let i = 0; i < 16; i++) {
          const d = document.createElement("div");
          const r = 7 + R() * 12;
          d.style.cssText = "position:absolute;left:" + (300 + R() * 400) + "px;top:" + (700 + R() * 950) + "px;width:" + r * 2 + "px;height:" + r * 2.3 + "px;border-radius:50% 50% 50% 50% / 45% 45% 55% 55%;" +
            "background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.95) 0 16%, rgba(210,236,242,0.25) 40%, rgba(120,160,175,0.35) 80%, rgba(255,255,255,0.0) 100%);box-shadow:1px 2px 3px rgba(20,60,80,0.25);opacity:0;";
          drops.appendChild(d);
        }

        /* ---------- 0 – 2 s · HOOK: split before / after ---------- */
        gsap.set("#before-split", { opacity: 1, "--sx": "50%" });
        gsap.set("#before-wipe", { opacity: 0 });
        tl.fromTo("#split-line", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.5, ease: "expo.out" }, 0.55);
        tl.fromTo(["#lb-before", "#lb-after"], { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.4)", stagger: 0.1 }, 0.75);
        ["#h1", "#h2", "#h3"].forEach((id, i) => tl.fromTo(id, { opacity: 0, y: 40, scale: 1.08 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, 0.88 + i * 0.26));
        tl.fromTo("#hook", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.4)", transformOrigin: "0% 0%" }, 0.8);
        tl.to(["#hook", "#lb-after", "#split-line"], { opacity: 0, duration: 0.3, ease: "power2.in" }, 1.85);
        // the grease takes over the whole frame
        tl.to("#before-split", { "--sx": "101%", duration: 0.45, ease: "expo.inOut" }, 1.85);

        /* ---------- 2 – 5.5 s · BEFORE, slow inquisitive zoom ---------- */
        tl.set("#before-wipe", { opacity: 1 }, 2.3);
        tl.set("#before-split", { opacity: 0 }, 2.3);
        tl.to("#scene", Object.assign({ duration: 3.4, ease: "sine.inOut" }, cam(1.05, 760, 1560, 540, 1150)), 2.0);
        tl.fromTo("#lb-before", { scale: 1 }, { scale: 1.08, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "0% 50%" }, 2.4);

        /* ---------- 5.5 – 8.5 s · APPLICATION ---------- */
        const BS = 0.52;                      // bottle display scale
        const nozzle = [30, 82];              // nozzle tip, bottle px
        const BX = 620, BY = 1290;            // bottle bottom-centre on screen during the spray
        const bpos = (x, y, rot) => ({ x: x - 422, y: y - 1800, scale: BS, rotation: rot });
        gsap.set("#bottle-wrap", Object.assign({ opacity: 0 }, bpos(1500, BY, -6)));
        tl.to("#lb-before", { opacity: 0, duration: 0.25 }, 5.3);
        tl.fromTo("#bottle-wrap", Object.assign({ opacity: 1 }, bpos(1500, BY, 4)), Object.assign({ opacity: 1, duration: 0.7, ease: "back.out(1.2)", immediateRender: false }, bpos(BX, BY, -14)), 5.5);
        tl.to("#scene", Object.assign({ duration: 3.0, ease: "sine.inOut" }, cam(1.0, 760, 1600, 540, 1250)), 5.5);
        tl.fromTo("#timer", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.4)", immediateRender: false }, 5.8);
        // two trigger pulls: squash & stretch + mist cone
        [6.3, 6.9].forEach((t0, k) => {
          tl.to("#bottle-wrap", { scaleY: BS * 0.955, scaleX: BS * 1.02, duration: 0.07, ease: "power2.in" }, t0);
          tl.to("#bottle-wrap", { scaleY: BS, scaleX: BS, duration: 0.25, ease: "elastic.out(1, 0.5)" }, t0 + 0.07);
          const nz = [BX - 422 * BS + nozzle[0] * BS - 18, BY - 1800 * BS + nozzle[1] * BS + 24];   // on screen (approx after rotation)
          mists.forEach((m, i) => {
            if (i % 2 !== k) return;
            const aim = Math.atan2(1180 - nz[1], 260 - nz[0]);          // towards the grease around the left burners
            const a = aim + (R() - 0.5) * 0.55, dist = 180 + R() * 560;
            const tx = nz[0] + Math.cos(a) * dist, ty = nz[1] + Math.sin(a) * dist;
            const dly = R() * 0.22;
            tl.fromTo(m.el, { x: nz[0], y: nz[1], opacity: 0.95, scale: 0.3 }, { x: tx, y: ty, opacity: 0, scale: 2.2 + R() * 2.2, duration: 0.5 + R() * 0.45, ease: "power3.out", immediateRender: false }, t0 + dly);
          });
        });
        tl.to("#bottle-wrap", Object.assign({ duration: 0.55, ease: "power2.in" }, bpos(1600, BY + 40, 8)), 7.9);
        bubs.forEach((d, i) => tl.fromTo(d, { opacity: 0, scale: 0.1 }, { opacity: 0.95, scale: 1, duration: 0.45 + R() * 0.4, ease: "back.out(1.6)", immediateRender: false }, 6.5 + R() * 1.6));

        /* ---------- 8.5 – 14 s · PROGRESSIVE REVEAL (2 sponge passes) ---------- */
        const tEl = document.getElementById("timer-t");
        tl.to("#timer", { backgroundColor: "#23c9ee", scale: 1.08, duration: 0.15, yoyo: true, repeat: 1, ease: "power2.out", transformOrigin: "0% 50%" }, 14.0);
        tl.fromTo(["#gauge", "#gauge-lb"], { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, 8.5);
        const gEl = document.getElementById("gauge-lb");
        // sponge follows the wipe front, scrubbing back and forth along it
        const SPW = 300, SPH = 338;
        const front = (w, u) => {   // point on the wipe line (w in %, u in 0..1 along the line), scene px
          const ang = 118 * Math.PI / 180, dx = Math.sin(ang), dy = -Math.cos(ang);
          const L = Math.abs(1300 * dx) + Math.abs(2311 * dy);
          const cx = 650 + (w / 100 - 0.5) * L * dx, cy = 1155 + (w / 100 - 0.5) * L * dy;
          const px = -dy, py = dx;  // along the line
          const yA = 1330, yB = 2200;   // keep the sponge on the hob surface
          const kA = (yA - cy) / py, kB = (yB - cy) / py;
          const k = kA + (kB - kA) * u;
          return [cx + px * k, cy + py * k];
        };
        tl.fromTo("#sponge", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, 8.6);
        tl.fromTo("#gauge-fill", { scaleY: 0 }, { scaleY: 0.5, duration: 2.1, ease: "sine.inOut", immediateRender: false }, 8.7);
        tl.fromTo("#gauge-fill", { scaleY: 0.5 }, { scaleY: 1, duration: 2.2, ease: "sine.inOut", immediateRender: false }, 11.0);
        tl.to("#sponge", { opacity: 0, duration: 0.25 }, 13.25);
        tl.to("#scene", Object.assign({ duration: 5.2, ease: "sine.inOut" }, cam(0.92, 760, 1600, 540, 1180)), 8.5);
        sparks.forEach((d, i) => {
          const t0 = (i < 13 ? 10.9 : 13.3) + R() * 0.9;
          tl.fromTo(d, { opacity: 0, scale: 0.2, rotation: 0 }, { opacity: 1, scale: 0.8 + R() * 0.7, rotation: 45, duration: 0.25, ease: "power2.out", immediateRender: false }, t0);
          tl.to(d, { opacity: 0, scale: 0.1, rotation: 90, duration: 0.45, ease: "power2.in" }, t0 + 0.3);
        });
        tl.to(["#gauge", "#gauge-lb", "#timer"], { opacity: 0, duration: 0.3 }, 14.35);

        /* ---------- 14 – 18.5 s · SLIDER COMPARISON ---------- */
        tl.set("#before-wipe", { opacity: 0 }, 14.3);
        tl.set("#before-split", { opacity: 1 }, 14.3);
        tl.to("#scene", Object.assign({ duration: 0.4, ease: "power2.out" }, FULL), 14.3);
        tl.fromTo("#handle", { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, 14.4);
        tl.fromTo(["#lb-before2", "#lb-after2"], { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.4)", stagger: 0.1, immediateRender: false }, 14.5);
        tl.to(["#handle", "#lb-before2", "#lb-after2"], { opacity: 0, duration: 0.3 }, 18.3);

        /* ---------- 18.5 – 22 s · PACKSHOT ---------- */
        tl.fromTo("#pack", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.inOut", immediateRender: false }, 18.4);
        const PX = 540, PY = 1340, PS = 0.56;
        tl.fromTo("#bottle-wrap", { x: PX - 422, y: PY - 1800 + 80, scale: PS * 0.94, rotation: 0, opacity: 0 }, { x: PX - 422, y: PY - 1800, scale: PS, opacity: 1, duration: 0.7, ease: "power3.out", immediateRender: false }, 18.6);
        tl.to("#bottle-wrap", { scale: PS * 1.025, duration: 2.8, ease: "sine.inOut" }, 19.3);
        gsap.set("#reflection", { scaleY: -1, y: 1800 * 2 - 6, opacity: 0 });
        tl.to("#reflection", { opacity: 0.38, duration: 0.5 }, 18.9);
        tl.fromTo("#drops > div", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, stagger: 0.05, ease: "back.out(2)", immediateRender: false }, 19.4);
        tl.fromTo("#pk-name", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 19.1);
        tl.fromTo("#pk-sig", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 19.4);
        tl.fromTo("#pk-claim", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 19.8);
        gsap.set(["#pk-name", "#pk-sig", "#pk-claim"], { opacity: 0 });
        if (SIGNATURE_WATERMARK && SIGNATURE_ENDCARD) tl.fromTo("#watermark", { opacity: 0 }, { opacity: 0.3, duration: 0.4, immediateRender: false }, 20.0);

        const ss = (p) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, p)));
        const seg = (t, t0, d, a, b2) => a + (b2 - a) * ss((t - t0) / d);
        const wipeEl = document.getElementById("before-wipe"), spEl = document.getElementById("sponge"), splitEl = document.getElementById("before-split");
        const SL = [[14.6, 540], [15.5, 250], [16.8, 830], [17.9, 330], [18.7, 540]];
        function state() {
          const t = tl.time();
          // wipe front + gauge
          let w, g, prog = -1;
          if (t < 8.7) { w = -12; g = 0; }
          else if (t < 10.8) { prog = (t - 8.7) / 2.1; w = seg(t, 8.7, 2.1, 16, 58); g = seg(t, 8.7, 2.1, 0, 50); }
          else if (t < 11.0) { w = 58; g = 50; }
          else if (t < 13.2) { prog = (t - 11.0) / 2.2; w = seg(t, 11.0, 2.2, 58, 106); g = seg(t, 11.0, 2.2, 50, 100); }
          else { w = 106; g = 100; }
          wipeEl.style.setProperty("--w", w + "%");
          foam.style.setProperty("--w", w + "%");
          gEl.textContent = Math.round(g) + " %";
          if (prog >= 0) {
            const u = 0.5 + 0.34 * Math.sin(prog * Math.PI * 7);
            const p = front(w + 1.5, u);
            if (p[0] < 170) { const q = front(w + 1.5, 0.5 + 0.12 * Math.sin(prog * Math.PI * 7)); p[0] = Math.max(170, q[0]); p[1] = q[1]; }
            p[0] = Math.min(1180, p[0]);
            spEl.style.transform = "translate(" + (p[0] - SPW / 2) + "px," + (p[1] - SPH / 2) + "px) rotate(" + (-18 + Math.sin(prog * Math.PI * 7) * 10) + "deg)";
          }
          // timer 00:00 -> 00:10, one second at a time
          const sec = t < 8.5 ? 0 : Math.min(10, Math.floor((t - 8.5) / 0.55 + 1e-6));
          tEl.textContent = "00:" + (sec < 10 ? "0" : "") + sec;
          // comparison slider
          let x = 540;
          for (let i = 0; i < SL.length - 1; i++) if (t >= SL[i][0] && t < SL[i + 1][0]) x = seg(t, SL[i][0], SL[i + 1][0] - SL[i][0], SL[i][1], SL[i + 1][1]);
          document.getElementById("handle").style.left = (x - 3) + "px";
          if (t >= 14.3) splitEl.style.setProperty("--sx", (x / 1080 * 100).toFixed(2) + "%");
        }
        tl.eventCallback("onUpdate", state);
        state();

        const host = document.getElementById("nettra");
        SE.addVignette(host, 0.14, "11,42,74");
        SE.addGrain(host, tl, { opacity: 0.045, duration: T, fps: 30, blend: "overlay", seed: 4 });
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
