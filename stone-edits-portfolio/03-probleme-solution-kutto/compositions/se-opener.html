<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Stone Edits — ouverture</title>
  </head>
  <body>
    <template>
      <style>
        #se-opener { position: absolute; inset: 0; overflow: hidden; container-type: size; pointer-events: none; }
        /* the cut runs through the centre at the logo blade angle */
        #se-opener .op-rot { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform: rotate(-43.7deg); }
        #se-opener .op-half { position: absolute; left: -150cqmax; width: 300cqmax; height: 150cqmax; background: #0a0a0a; }
        #se-opener .op-top { top: -150cqmax; }
        #se-opener .op-bot { top: 0; }
        #se-opener .op-edge { position: absolute; left: -150cqmax; width: 300cqmax; height: 2px; }
        #se-opener .op-edge-t { bottom: -1px; background: linear-gradient(90deg, rgba(201,164,76,0) 20%, #f1d58a 50%, rgba(201,164,76,0) 80%); }
        #se-opener .op-edge-b { top: -1px; background: linear-gradient(90deg, rgba(201,164,76,0) 20%, #c9a44c 50%, rgba(201,164,76,0) 80%); }
        #se-opener .op-blade { position: absolute; top: -6px; width: 46cqmax; height: 12px; filter: drop-shadow(0 0 10px rgba(241,213,138,0.7)); }
        #se-opener .op-blade-l { right: 0; background: linear-gradient(90deg, rgba(140,106,36,0) 0%, #8c6a24 30%, #f1d58a 92%, #fffaf0 100%); clip-path: polygon(0 50%, 100% 0, 100% 100%); }
        #se-opener .op-blade-r { left: 0; background: linear-gradient(270deg, rgba(140,106,36,0) 0%, #8c6a24 30%, #f1d58a 92%, #fffaf0 100%); clip-path: polygon(0 0, 100% 50%, 0 100%); }
        #se-opener .op-flash { position: absolute; left: -40cqmax; top: -40cqmax; width: 80cqmax; height: 80cqmax; border-radius: 50%;
          background: radial-gradient(circle, rgba(255,250,235,0.95) 0%, rgba(241,213,138,0.55) 12%, rgba(201,164,76,0) 45%); opacity: 0; }
        #se-opener .op-spark { position: absolute; left: 0; top: -1px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, #fffaf0, #f1d58a 40%, rgba(201,164,76,0)); transform-origin: 0 50%; opacity: 0; }
      </style>

      <div id="se-opener" data-composition-id="se-opener" data-width="1080" data-height="1920" data-duration="0.9">
        <div class="op-rot" id="op-shake">
          <div class="op-half op-top" id="op-top"><div class="op-edge op-edge-t"></div></div>
          <div class="op-half op-bot" id="op-bot"><div class="op-edge op-edge-b"></div></div>
          <div class="op-blade op-blade-l" id="op-bl"></div>
          <div class="op-blade op-blade-r" id="op-br"></div>
          <div class="op-flash" id="op-flash"></div>
          <div id="op-sparks"></div>
        </div>
        <audio id="se-op-whoosh" src="assets/sfx/whoosh-short.mp3" data-start="0" data-duration="0.5" data-track-index="23" data-volume="0.5"></audio>
        <audio id="se-op-clash" src="assets/sfx/impact-bass-2.mp3" data-start="0.16" data-duration="0.74" data-track-index="24" data-volume="0.45"></audio>
      </div>

      <script>
        (function () {
          const root = document.getElementById("se-opener");
          const R = Math.max(root.clientWidth || 1080, root.clientHeight || 1920); // 100cqmax in px
          const tl = gsap.timeline({ paused: true });
          const HIT = 0.18;

          // blades rush in along the cut from opposite corners and strike at the centre
          tl.fromTo("#op-bl", { x: -0.62 * R }, { x: 0.012 * R, duration: HIT, ease: "power2.in" }, 0);
          tl.fromTo("#op-br", { x: 0.62 * R }, { x: -0.012 * R, duration: HIT, ease: "power2.in" }, 0);
                    // clash: flash, recoil, sparks, 3-frame shake
          tl.fromTo("#op-flash", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.05, ease: "power2.out" }, HIT);
          tl.to("#op-flash", { opacity: 0, scale: 1.3, duration: 0.3, ease: "power2.out" }, HIT + 0.05);
          tl.to("#op-bl", { x: -0.05 * R, duration: 0.12, ease: "power3.out" }, HIT);
          tl.to("#op-br", { x: 0.05 * R, duration: 0.12, ease: "power3.out" }, HIT);
          tl.fromTo("#op-shake", { x: 0, y: 0 }, { keyframes: [{ x: 6, y: -4, duration: 0.033 }, { x: -5, y: 5, duration: 0.033 }, { x: 3, y: -2, duration: 0.033 }, { x: 0, y: 0, duration: 0.033 }], ease: "none" }, HIT);

          const rnd = SE_prng(11);
          const sparks = document.getElementById("op-sparks");
          for (let i = 0; i < 26; i++) {
            const s = document.createElement("div");
            s.className = "op-spark";
            const len = (0.03 + rnd() * 0.07) * R;
            const ang = (rnd() < 0.5 ? 90 : -90) + (rnd() - 0.5) * 150;
            const dist = (0.08 + rnd() * 0.22) * R;
            s.style.width = len + "px";
            sparks.appendChild(s);
            const rad = (ang * Math.PI) / 180;
            tl.fromTo(s, { opacity: 1, rotation: ang, x: 0, y: 0, scaleX: 0.2 },
              { x: Math.cos(rad) * dist, y: Math.sin(rad) * dist, scaleX: 1, opacity: 0, duration: 0.28 + rnd() * 0.25, ease: "power3.out", immediateRender: false }, HIT + rnd() * 0.03);
          }

          // the black splits along the cut and the two halves part to reveal the film
          tl.to("#op-top", { y: -0.95 * R, duration: 0.6, ease: "expo.inOut" }, HIT + 0.1);
          tl.to("#op-bot", { y: 0.95 * R, duration: 0.6, ease: "expo.inOut" }, HIT + 0.1);
          tl.to("#op-bl", { x: -1.2 * R, opacity: 0, duration: 0.5, ease: "power3.in" }, HIT + 0.14);
          tl.to("#op-br", { x: 1.2 * R, opacity: 0, duration: 0.5, ease: "power3.in" }, HIT + 0.14);

          window.__timelines["se-opener"] = tl;

          function SE_prng(seed) {
            let s = seed >>> 0;
            return function () {
              s = (s + 0x6d2b79f5) >>> 0;
              let t = s;
              t = Math.imul(t ^ (t >>> 15), t | 1);
              t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }
        })();
      </script>
    </template>
  </body>
</html>
