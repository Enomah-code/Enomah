<!doctype html>
<html
  lang="fr"
  data-composition-variables='[
    {"id":"SIGNATURE_ENDCARD","type":"boolean","label":"Carte de fin Stone Edits","default":true},
    {"id":"SIGNATURE_WATERMARK","type":"boolean","label":"Filigrane Stone Edits","default":true}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Lumen Watch S</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/shared/polish.js"></script>
    <style>
      @font-face { font-family: 'Cormorant Garamond'; font-style: italic; font-weight: 500; font-display: block; src: url('assets/fonts/cormorant-garamond-500i.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 300; font-display: block; src: url('assets/fonts/inter-300.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: block; src: url('assets/fonts/inter-500.woff2') format('woff2'); }

      :root { --bg: #efece7; --bg2: #ddd7ce; --champ: #c8a76a; --sand: #b9ae9c; --ink: #1d1d1f; --taupe: #7d766c; }
      body { margin: 0; background: var(--bg); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
      #lumen { position: absolute; inset: 0; overflow: hidden; font-family: 'Inter', sans-serif; color: var(--ink);
        background: radial-gradient(ellipse 70% 62% at 50% 44%, #f6f3ee 0%, var(--bg) 45%, var(--bg2) 100%); }

      /* ---------- photographic shot (plate space: 4000 x 4000) ---------- */
      .shot { position: absolute; left: 0; top: 0; width: 4000px; height: 4000px; transform-origin: 0 0; }
      .shot img { position: absolute; left: 0; top: 0; width: 4000px; height: 4000px; display: block; }
      #plate-blur { filter: blur(26px); opacity: 0;
        -webkit-mask-image: radial-gradient(ellipse 34% 30% at var(--fx, 50%) var(--fy, 50%), rgba(0,0,0,0) 0%, rgba(0,0,0,0) 55%, #000 100%);
        mask-image: radial-gradient(ellipse 34% 30% at var(--fx, 50%) var(--fy, 50%), rgba(0,0,0,0) 0%, rgba(0,0,0,0) 55%, #000 100%); }
      /* specular light sweep, clipped to the watch silhouette */
      #sweep { position: absolute; left: 0; top: 0; width: 4000px; height: 4000px; mix-blend-mode: screen; opacity: 0.9; overflow: hidden;
        -webkit-mask-image: url('assets/img/lumen-watch.webp'); mask-image: url('assets/img/lumen-watch.webp');
        -webkit-mask-size: 4000px 4000px; mask-size: 4000px 4000px; }
      #sweep-band { position: absolute; left: -1600px; top: -800px; width: 900px; height: 4800px; transform-origin: 50% 50%;
        background: linear-gradient(90deg, rgba(255,240,210,0) 0%, rgba(255,240,210,0.30) 40%, rgba(255,250,235,0.55) 50%, rgba(255,240,210,0.30) 60%, rgba(255,240,210,0) 100%); }
      #screen-ui { position: absolute; left: 0; top: 0; width: 880px; height: 1100px; transform-origin: 0 0; }
      #wrist-ui { position: absolute; left: 0; top: 0; width: 800px; height: 1000px; transform-origin: 0 0; }
      .ui { position: absolute; inset: 0; border-radius: 150px; overflow: hidden; background: radial-gradient(ellipse at 50% 30%, #121214 0%, #050506 70%); }
      .ui .glare { position: absolute; inset: 0; background: linear-gradient(118deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.07) 44%, rgba(255,255,255,0) 58%); }

      /* wrist shot (3000 x 1800 at display scale 1) */
      #wrist-shot { position: absolute; left: 0; top: 0; width: 3000px; height: 1800px; transform-origin: 0 0; opacity: 0; }
      #wrist-shot img { position: absolute; left: 0; top: 0; width: 3000px; height: 1800px; }
      #wrist-shadow { position: absolute; left: 60px; top: 1330px; width: 2600px; height: 180px; border-radius: 50%;
        background: radial-gradient(ellipse at 40% 50%, rgba(70,56,44,0.30) 0%, rgba(70,56,44,0) 70%); filter: blur(30px); }

      /* ---------- HUD / callouts ---------- */
      #hud { position: absolute; inset: 0; pointer-events: none; }
      #hud svg { position: absolute; inset: 0; width: 1080px; height: 1080px; overflow: visible; }
      .co-line { fill: none; stroke: var(--champ); stroke-width: 1.5; }
      .co-dot { fill: var(--champ); }
      .co-anchor { fill: none; stroke: var(--champ); stroke-width: 1.5; }
      .label { position: absolute; font-weight: 500; text-transform: uppercase; letter-spacing: 0.12em; font-size: 22px; line-height: 1.25; color: var(--ink); white-space: nowrap; }
      .label small { display: block; font-weight: 300; font-size: 17px; color: #5f5950; letter-spacing: 0.14em; margin-top: 6px; }
      .dim { position: absolute; font-weight: 500; font-size: 15px; letter-spacing: 0.2em; color: #5f5950; white-space: nowrap; }

      /* ---------- titles ---------- */
      #title-wrap { position: absolute; right: 84px; top: 72px; width: 520px; height: 170px; }
      #tag { position: absolute; right: 2px; bottom: 140px; font-weight: 500; font-size: 15px; letter-spacing: 0.3em; color: #5f5950; text-transform: uppercase; }
      #name { position: absolute; right: 0; bottom: 58px; font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 70px; line-height: 1; letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }
      #rule { position: absolute; right: 2px; bottom: 16px; width: 110px; height: 1.5px; background: var(--champ); transform-origin: 100% 50%; }
      #price { position: absolute; right: 134px; bottom: -4px; font-weight: 300; font-size: 40px; letter-spacing: 0.04em; color: var(--ink); font-feature-settings: "tnum" 1; }
      #watermark { position: absolute; right: 84px; bottom: 76px; width: 53px; height: 56px; opacity: 0; filter: brightness(0.12); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1080" data-duration="19.5" data-main-duration="18">
      <section id="lumen" class="clip" data-start="0" data-duration="18" data-track-index="0">
        <div class="shot" id="shot">
          <img id="plate" src="assets/img/lumen-plate.jpg" alt="" />
          <div id="screen-ui" data-layout-allow-overlap data-layout-allow-overflow data-layout-allow-occlusion></div>
          <div id="sweep"><div id="sweep-band"></div></div>
          <img id="plate-blur" src="assets/img/lumen-plate.jpg" alt="" />
        </div>
        <div id="wrist-shot">
          <div id="wrist-shadow"></div>
          <img src="assets/img/lumen-wrist.webp" alt="" />
          <div id="wrist-ui" data-layout-allow-overlap data-layout-allow-overflow></div>
        </div>

        <div id="hud">
          <svg viewBox="0 0 1080 1080">
            <g id="co1"><circle class="co-anchor" id="co1-a" r="7" /><path class="co-line" id="co1-l" /><circle class="co-dot" id="co1-d" r="4.5" /></g>
            <g id="co2"><circle class="co-anchor" id="co2-a" r="7" /><path class="co-line" id="co2-l" /><circle class="co-dot" id="co2-d" r="4.5" /></g>
            <g id="co3"><circle class="co-anchor" id="co3-a" r="7" /><path class="co-line" id="co3-l" /><circle class="co-dot" id="co3-d" r="4.5" /></g>
            <g id="dims"><path class="co-line" id="dim-l" /><path class="co-line" id="dim-t" /><path class="co-line" id="dim-b" /></g>
          </svg>
          <div class="label" id="lb1">Amoled 1,9″<small>2000 nits</small></div>
          <div class="label" id="lb2">Titane grade 5<small>Boîtier brossé</small></div>
          <div class="label" id="lb3">Couronne haptique<small>Un cran, un geste</small></div>
          <div class="dim" id="dim-lb1">44 MM</div>
          <div class="dim" id="dim-lb2">38 G</div>

        <div id="title-wrap">

        <img id="watermark" src="assets/brand/stone-edits-logo-blanc.svg" alt="" />
      </section>

      <div id="se-opener" data-composition-id="se-opener" data-composition-src="compositions/se-opener.html"
        data-start="0" data-duration="0.9" data-track-index="6" data-width="1080" data-height="1080"></div>
      <div id="se-endcard" data-composition-id="se-endcard" data-composition-src="compositions/se-endcard.html"
        data-start="18" data-duration="1.5" data-track-index="5" data-width="1080" data-height="1080"
        data-variable-values='{"logoPct":20}'></div>

      <!-- sound design (Pixabay Content License) -->
      <audio id="sfx-move1" src="assets/sfx/whoosh-cinematic.mp3" data-start="4.3" data-duration="1.6" data-track-index="10" data-volume="0.16"></audio>
      <audio id="sfx-wake" src="assets/sfx/click-soft.mp3" data-start="5.2" data-duration="0.36" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-ping1" src="assets/sfx/ping.mp3" data-start="5.55" data-duration="1.2" data-track-index="12" data-volume="0.1"></audio>
      <audio id="sfx-move2" src="assets/sfx/whoosh-cinematic.mp3" data-start="7.6" data-duration="1.6" data-track-index="13" data-volume="0.14"></audio>
      <audio id="sfx-move3" src="assets/sfx/whoosh-short.mp3" data-start="10.7" data-duration="0.6" data-track-index="14" data-volume="0.14"></audio>
      <audio id="sfx-tick" src="assets/sfx/click-soft.mp3" data-start="12.0" data-duration="0.36" data-track-index="15" data-volume="0.7"></audio>
      <audio id="sfx-tick2" src="assets/sfx/click.mp3" data-start="12.667" data-duration="0.36" data-track-index="16" data-volume="0.4"></audio>
      <audio id="sfx-move4" src="assets/sfx/whoosh-cinematic.mp3" data-start="13.2" data-duration="1.4" data-track-index="17" data-volume="0.12"></audio>
      <audio id="sfx-chime" src="assets/sfx/chime.mp3" data-start="14.667" data-duration="2.2" data-track-index="18" data-volume="0.28"></audio>
      <audio id="sfx-move5" src="assets/sfx/whoosh-short.mp3" data-start="16.3" data-duration="0.6" data-track-index="19" data-volume="0.12"></audio>
    </div>

    <script>
      (function () {
        const V = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const SIGNATURE_ENDCARD = V.SIGNATURE_ENDCARD !== false;
        const SIGNATURE_WATERMARK = V.SIGNATURE_WATERMARK !== false;
        if (!SIGNATURE_ENDCARD) {
          document.getElementById("se-endcard").setAttribute("data-hidden", "");
          document.getElementById("se-opener").setAttribute("data-hidden", "");
        }
        const b = SE.beatGrid(90);
        const T = 18;

        /* ---------- perspective mapping of a flat UI onto a photographed screen ---------- */
        function homography(w, h, Q) {
          const src = [[0, 0], [w, 0], [w, h], [0, h]];
          const A = [], B = [];
          for (let i = 0; i < 4; i++) {
            const [x, y] = src[i], [u, v] = Q[i];
            A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); B.push(u);
            A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); B.push(v);
          }
          for (let c = 0; c < 8; c++) {
            let p = c;
            for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
            [A[c], A[p]] = [A[p], A[c]]; [B[c], B[p]] = [B[p], B[c]];
            for (let r = 0; r < 8; r++) if (r !== c) {
              const f = A[r][c] / A[c][c];
              for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k];
              B[r] -= f * B[c];
            }
          }
          const H = B.map((v, i) => v / A[i][i]);
          return "matrix3d(" + [H[0], H[3], 0, H[6], H[1], H[4], 0, H[7], 0, 0, 1, 0, H[2], H[5], 0, 1].map((n) => n.toFixed(8)).join(",") + ")";
        }
        const QW = [[1152, 1363], [2209, 963], [2914, 2030], [1735, 2510]];    // hero screen, plate px
        const QH = [[303, 934], [637.5, 919], [637.5, 1342.5], [303, 1354]];   // wrist screen, wrist px

        /* hero watch UI (880 x 1100 design units) */
        let ticks = "";
        for (let i = 0; i < 60; i++) {
          const L = i % 5 === 0 ? 22 : 11;
          ticks += '<line x1="0" y1="-236" x2="0" y2="' + (-236 + L) + '" stroke="' + (i % 5 === 0 ? "#c8a76a" : "#4d4841") + '" stroke-width="4" transform="rotate(' + i * 6 + ')"/>';
        }
        const sui = document.getElementById("screen-ui");
        sui.style.transform = homography(880, 1100, QW);
        sui.innerHTML =
          '<div class="ui" id="ui-face" style="opacity:0">' +
            '<div id="ui-time" style="position:absolute;left:0;right:0;top:92px;text-align:center;font:300 200px/1 Inter,sans-serif;color:#edeae4;letter-spacing:-0.02em;font-feature-settings:\'tnum\' 1;">' +
              '<span>09:4</span><span style="display:inline-block;position:relative;width:0.62em;height:1em;overflow:hidden;vertical-align:top;"><span id="ui-m1" style="position:absolute;left:0;top:0;">1</span><span id="ui-m2" style="position:absolute;left:0;top:0;">2</span></span></div>' +
            '<div style="position:absolute;left:0;right:0;top:318px;text-align:center;font:500 38px/1 Inter,sans-serif;letter-spacing:0.24em;color:#8f887e;">MAR. 14 MAI</div>' +
            '<svg viewBox="-260 -260 520 520" style="position:absolute;left:200px;top:400px;width:480px;height:480px;">' + ticks +
              '<circle r="190" fill="none" stroke="rgba(200,167,106,0.16)" stroke-width="16"/><circle r="156" fill="none" stroke="rgba(185,174,156,0.16)" stroke-width="16"/>' +
              '<circle id="ring1" r="190" fill="none" stroke="#c8a76a" stroke-width="16" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="1193.8" stroke-dashoffset="1193.8"/>' +
              '<circle id="ring2" r="156" fill="none" stroke="#b9ae9c" stroke-width="16" stroke-linecap="round" transform="rotate(-90)" stroke-dasharray="980.2" stroke-dashoffset="980.2"/>' +
              '<text x="0" y="22" text-anchor="middle" style="font:300 76px Inter,sans-serif;fill:#edeae4;">8 426</text>' +
              '<text x="0" y="74" text-anchor="middle" style="font:500 26px Inter,sans-serif;letter-spacing:8px;fill:#8f887e;">PAS</text>' +
            '</svg>' +
            '<svg viewBox="0 0 700 120" style="position:absolute;left:90px;bottom:70px;width:700px;height:120px;overflow:visible;">' +
              '<path id="ui-ecg" d="M0 72 L150 72 L178 72 L198 36 L220 92 L242 6 L264 114 L286 72 L410 72 L432 54 L454 72 L700 72" fill="none" stroke="#c8a76a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="900" stroke-dashoffset="900"/>' +
            '</svg>' +
            '<div style="position:absolute;right:100px;bottom:190px;font:500 40px/1 Inter,sans-serif;letter-spacing:0.12em;color:#edeae4;"><span style="color:#c8a76a">♥</span> 72 BPM</div>' +
            '<div class="glare"></div>' +
          '</div>';

        sui.querySelectorAll("*").forEach((e) => { e.setAttribute("data-layout-allow-overlap", ""); e.setAttribute("data-layout-allow-occlusion", ""); });

        /* wrist notification UI (800 x 1000) */
        const wui = document.getElementById("wrist-ui");
        wui.style.transform = homography(800, 1000, QH);
        wui.innerHTML =
          '<div class="ui" id="wui-face" style="border-radius:170px;opacity:0">' +
            '<div style="position:absolute;left:0;right:0;top:90px;text-align:center;font:300 150px/1 Inter,sans-serif;color:#edeae4;">09:58</div>' +
            '<div id="wui-card" style="position:absolute;left:44px;right:44px;top:330px;height:560px;border-radius:70px;background:#26262a;">' +
              '<div style="position:absolute;left:60px;top:70px;width:36px;height:36px;border-radius:50%;background:#c8a76a;"></div>' +
              '<div style="position:absolute;left:124px;top:70px;font:500 36px/1 Inter,sans-serif;letter-spacing:0.2em;color:#8f887e;">AGENDA</div>' +
              '<div style="position:absolute;left:60px;top:170px;font:italic 500 112px/1 \'Cormorant Garamond\',serif;color:#edeae4;">Atelier,</div>' +
              '<div style="position:absolute;left:60px;top:290px;font:italic 500 112px/1 \'Cormorant Garamond\',serif;color:#edeae4;">10:00</div>' +
              '<div style="position:absolute;left:60px;top:440px;font:300 40px/1 Inter,sans-serif;letter-spacing:0.08em;color:#b9ae9c;">Salle Lumière</div>' +
            '</div>' +
            '<div class="glare"></div>' +
          '</div>';

        wui.querySelectorAll("*").forEach((e) => e.setAttribute("data-layout-allow-overlap", ""));

        /* ---------- camera: put plate point (px,py) at frame point (fx,fy) with scale s ---------- */
        const OX = 400, OY = 500; // authored coordinates -> 4000 px plate
        const cam = (s, px, py, fx, fy) => ({ scale: s, x: fx - s * (px + OX), y: fy - s * (py + OY) });
        const toFrame = (c, p) => [c.x + c.scale * (p[0] + OX), c.y + c.scale * (p[1] + OY)];
        const HERO = cam(0.3, 1560, 1640, 470, 610);
        const tl = gsap.timeline({ paused: true });
        gsap.set("#shot", HERO);

        /* callout: anchor ring, line draws, dot, label rises 12 px (always the same) */
        function place(id, lb, A, D, lx, ly, align) {
          const f = (p) => p[0].toFixed(1) + " " + p[1].toFixed(1);
          document.getElementById(id + "-a").setAttribute("cx", A[0]); document.getElementById(id + "-a").setAttribute("cy", A[1]);
          document.getElementById(id + "-d").setAttribute("cx", D[0]); document.getElementById(id + "-d").setAttribute("cy", D[1]);
          document.getElementById(id + "-l").setAttribute("d", "M" + f(A) + " L" + f(D));
          const el = document.querySelector(lb);
          el.style.top = ly + "px";
          if (align === "right") el.style.right = (1080 - lx) + "px"; else el.style.left = lx + "px";
        }
        function callout(id, lb, at, out) {
          const len = document.getElementById(id + "-l").getTotalLength();
          tl.fromTo("#" + id + "-a", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.4)" }, at);
          tl.fromTo("#" + id + "-l", { attr: { "stroke-dasharray": len, "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power3.out" }, at + 0.12);
          tl.fromTo("#" + id + "-d", { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(1.4)" }, at + 0.52);
          tl.fromTo(lb, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, at + 0.6);
          tl.to(["#" + id, lb], { opacity: 0, duration: 0.3, ease: "power2.in" }, out);
        }

        /* title block: visible on frame 0 and on the last frame (seamless loop) */
        tl.fromTo(["#name", "#price", "#tag"], { opacity: 1, y: 0 }, { opacity: 0, y: 10, duration: 0.5, ease: "power2.in", stagger: 0.05 }, 1.0);
        tl.fromTo("#rule", { scaleX: 1 }, { scaleX: 0, duration: 0.45, ease: "power2.in" }, 1.05);

        /* S1 · 0 – 4.5 s · slow orbit with a travelling studio light */
        const S1 = cam(0.39, 1640, 1400, 540, 540);
        tl.to("#shot", Object.assign({ duration: 4.4, ease: "sine.inOut" }, S1), 0);
        tl.fromTo("#sweep-band", { x: 400, rotation: 24 }, { x: 4800, rotation: 24, duration: 3.6, ease: "sine.inOut" }, 0.4);
        const dA = toFrame(S1, [620, 780]), dB = toFrame(S1, [1230, 2150]);
        const dimX = 104;
        document.getElementById("dim-l").setAttribute("d", "M" + dimX + " " + dA[1].toFixed(0) + " L" + dimX + " " + dB[1].toFixed(0));
        document.getElementById("dim-t").setAttribute("d", "M" + (dimX - 10) + " " + dA[1].toFixed(0) + " L" + (dimX + 10) + " " + dA[1].toFixed(0));
        document.getElementById("dim-b").setAttribute("d", "M" + (dimX - 10) + " " + dB[1].toFixed(0) + " L" + (dimX + 10) + " " + dB[1].toFixed(0));
        const midY = (dA[1] + dB[1]) / 2;
        Object.assign(document.getElementById("dim-lb1").style, { left: dimX - 58 + "px", top: midY - 40 + "px", transform: "rotate(-90deg)" });
        Object.assign(document.getElementById("dim-lb2").style, { left: dimX - 50 + "px", top: midY + 60 + "px", transform: "rotate(-90deg)" });
        const dimLen = dB[1] - dA[1];
        tl.fromTo("#dim-l", { attr: { "stroke-dasharray": dimLen, "stroke-dashoffset": dimLen } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.6, ease: "power3.out" }, b(2));
        tl.fromTo(["#dim-t", "#dim-b"], { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.1 }, b(2) + 0.2);
        tl.fromTo(["#dim-lb1", "#dim-lb2"], { opacity: 0, x: 12 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", stagger: 0.12 }, b(2) + 0.45);
        tl.to(["#dims", "#dim-lb1", "#dim-lb2"], { opacity: 0, duration: 0.35, ease: "power2.in" }, 4.0);

        /* S2 · 4.5 – 8.0 s · orbit into the screen, the watch wakes up */
        const S2 = cam(0.64, 1640, 1240, 600, 600);
        tl.to("#shot", Object.assign({ duration: 1.1, ease: "sine.inOut" }, S2), 4.4);
        tl.to("#shot", Object.assign({ duration: 2.4, ease: "sine.inOut" }, cam(0.68, 1640, 1240, 600, 600)), 5.5);
        tl.fromTo("#ui-face", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 5.2);
        tl.to("#ring1", { attr: { "stroke-dashoffset": 250 }, duration: 1.4, ease: "power3.out" }, b(8));
        tl.to("#ring2", { attr: { "stroke-dashoffset": 330 }, duration: 1.4, ease: "power3.out" }, b(8) + 0.14);
        tl.to("#ui-ecg", { attr: { "stroke-dashoffset": 0 }, duration: 1.4, ease: "sine.inOut" }, b(9));
        gsap.set("#ui-m2", { y: "100%" });
        tl.to("#ui-m1", { y: "-100%", duration: 0.35, ease: "power3.inOut" }, b(10));
        tl.to("#ui-m2", { y: "0%", duration: 0.35, ease: "power3.inOut" }, b(10));
        place("co1", "#lb1", toFrame(S2, [1180, 700]), [300, 172], 84, 104, "left");
        callout("co1", "#lb1", b(8.5), 7.7);

        /* S3 · 8.0 – 11.0 s · travelling along the case edge, shallow depth of field */
        const S3a = cam(1.0, 900, 760, 520, 640), S3b = cam(1.0, 1640, 470, 560, 640);
        tl.to("#shot", Object.assign({ duration: 0.9, ease: "sine.inOut" }, S3a), 7.75);
        tl.to("#shot", Object.assign({ duration: 2.35, ease: "sine.inOut" }, S3b), 8.65);
        tl.fromTo("#plate-blur", { opacity: 0, "--fx": "32.5%", "--fy": "31.5%" }, { opacity: 1, "--fx": "32.5%", "--fy": "31.5%", duration: 0.7, ease: "sine.inOut", immediateRender: false }, 7.9);
        tl.to("#plate-blur", { "--fx": "51%", "--fy": "24.25%", duration: 2.35, ease: "sine.inOut" }, 8.65);
        tl.to("#plate-blur", { opacity: 0, duration: 0.5, ease: "sine.inOut" }, 10.75);
        place("co2", "#lb2", [540, 600], [420, 300], 84, 248, "left");
        callout("co2", "#lb2", b(13), 10.65);

        /* S4 · 11.0 – 13.5 s · macro on the crown */
        const S4 = cam(1.45, 2258, 980, 380, 560);
        tl.to("#shot", Object.assign({ duration: 1.0, ease: "sine.inOut" }, S4), 10.75);
        tl.to("#shot", Object.assign({ duration: 1.6, ease: "sine.inOut" }, cam(1.5, 2258, 980, 380, 560)), 11.75);
        tl.set("#sweep-band", { x: 3700, y: 0, rotation: 70 }, 11.9);
        tl.to("#sweep-band", { y: -1600, duration: 0.3, ease: "power2.out" }, b(18));
        tl.set("#sweep-band", { x: 5200, y: 0, rotation: 24 }, 13.2);
        place("co3", "#lb3", [430, 560], [600, 470], 620, 440, "left");
        callout("co3", "#lb3", b(17), 13.15);

        /* S5 · 13.5 – 16.5 s · on the wrist, a notification arrives */
        const W0 = { scale: 0.62, x: 270 - 0.62 * 470, y: 560 - 0.62 * 1135 }, W1 = { scale: 0.66, x: 290 - 0.66 * 470, y: 560 - 0.66 * 1135 };
        tl.to("#shot", Object.assign({ duration: 0.8, ease: "power2.in" }, cam(1.9, 2258, 980, 380, 560)), 13.2);
        tl.fromTo("#wrist-shot", { opacity: 0, scale: 0.7, x: 320 - 0.7 * 470, y: 560 - 0.7 * 1135 }, Object.assign({ opacity: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, W0), 13.6);
        tl.to("#wrist-shot", Object.assign({ duration: 2.4, ease: "sine.inOut" }, W1), 14.0);
        tl.to("#shot", { opacity: 0, duration: 0.35, ease: "power2.in" }, 13.65);
        tl.set("#shot", { opacity: 1 }, 16.0);
        tl.fromTo("#wui-face", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, b(21.5));
        tl.fromTo("#wui-card", { y: -120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, b(22));

        /* S6 · 16.5 – 18.0 s · packshot, identical to frame 0 */
        tl.set("#shot", HERO, 16.0);
        tl.set("#ui-face", { opacity: 0 }, 16.0);
        tl.to("#wrist-shot", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 16.3);
        tl.fromTo("#tag", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 16.75);
        tl.fromTo("#name", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 16.85);
        tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, 16.95);
        tl.fromTo("#price", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", immediateRender: false }, 17.05);

        if (SIGNATURE_WATERMARK && SIGNATURE_ENDCARD) {
          tl.fromTo("#watermark", { opacity: 0 }, { opacity: 0.3, duration: 0.4, ease: "power2.out" }, 16.0);
        }

        const host = document.getElementById("lumen");
        SE.addVignette(host, 0.16, "90,78,62");
        SE.addGrain(host, tl, { opacity: 0.05, duration: T, fps: 30, blend: "overlay", seed: 2 });

        window.__timelines["main"] = tl;
      })();
    </script>
