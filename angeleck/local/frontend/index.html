/* ============================================================
   ANGELECK OS — Color System
   "Un diamant numérique intelligent."
   Premium black · deep sapphire · diamond blue · crystal · gold
   ============================================================ */
:root {
  /* ---- Premium blacks & surfaces (the obsidian stage) ---- */
  --ink-1000: #03050C;   /* deepest void */
  --ink-900:  #060A15;   /* app background */
  --ink-850:  #090F1F;   /* sunken panels */
  --ink-800:  #0D1426;   /* raised surface */
  --ink-750:  #111A30;   /* hover surface */
  --ink-700:  #16213B;   /* hairline / divider base */

  /* ---- Deep sapphire (EMK Blue Diamond depth) ---- */
  --sapphire-800: #08193A;
  --sapphire-700: #0B2150;
  --sapphire-600: #123069;
  --sapphire-500: #1B4488;

  /* ---- Diamond blue — the signature accent ramp ---- */
  --diamond-700: #1E63C4;
  --diamond-600: #2E7BE0;
  --diamond-500: #4DA3FF;   /* PRIMARY brand blue */
  --diamond-400: #74BBFF;
  --diamond-300: #9FD2FF;
  --ice-200:     #CDE7FF;
  --ice-100:     #E6F2FF;

  /* ---- Crystal / platinum (text on dark) ---- */
  --crystal-50:   #EAF3FF;  /* primary headline */
  --platinum-100: #D4E1F4;
  --platinum-200: #AFC0DC;  /* secondary text */
  --platinum-300: #7E91B2;  /* muted text */
  --platinum-400: #546484;  /* faint / disabled */
  --platinum-500: #364663;  /* hairline on dark */

  /* ---- Champagne gold (elite / orchestrator accent) ---- */
  --gold-300: #F2DDA8;
  --gold-400: #E7CD93;
  --gold-500: #D4B36A;

  /* ---- Discreet holographic spectrum (gradients only) ---- */
  --holo-blue: #4DA3FF;
  --holo-aqua: #57E6E0;
  --holo-peri: #8FA0FF;

  /* ---- Semantic ---- */
  --success: #3DDC97;
  --success-soft: rgba(61,220,151,0.14);
  --danger:  #FF6B81;
  --danger-soft: rgba(255,107,129,0.14);
  --warning: #E7CD93;
  --warning-soft: rgba(231,205,147,0.14);
  --info:    #4DA3FF;
  --info-soft: rgba(77,163,255,0.14);

  /* ---- Agent identity colors (holographic constellation) ---- */
  --agent-raphael: #E7CD93;  /* central — gold halo */
  --agent-sofia:   #4DA3FF;  /* Business    — diamond blue */
  --agent-maya:    #FF6FA5;  /* Marketing   — rose */
  --agent-nathan:  #3DDC97;  /* Copywriting — emerald */
  --agent-elena:   #C9A2FF;  /* Création    — soft violet */
  --agent-lucas:   #2FD6C3;  /* E-commerce  — teal */
  --agent-gabriel: #5B8CFF;  /* Technologie — indigo */
  --agent-emma:    #57E6E0;  /* Data        — aqua */
  --agent-adam:    #E7CD93;  /* Finance     — gold */
  --agent-noah:    #FF9E5C;  /* Média       — amber */
  --agent-lea:     #FF6B81;  /* Sécurité    — red */

  /* ======================================================
     SEMANTIC ALIASES — use these in product UI
     ====================================================== */
  --bg-app:         var(--ink-900);
  --bg-void:        var(--ink-1000);
  --surface-sunken: var(--ink-850);
  --surface-card:   var(--ink-800);
  --surface-raised: var(--ink-750);

  --text-strong:  var(--crystal-50);
  --text-body:    var(--platinum-100);
  --text-muted:   var(--platinum-300);
  --text-faint:   var(--platinum-400);
  --text-accent:  var(--diamond-400);

  --border-hairline: rgba(150,190,255,0.10);
  --border-soft:     rgba(150,190,255,0.16);
  --border-strong:   rgba(150,190,255,0.28);
  --border-accent:   rgba(77,163,255,0.45);

  --accent:       var(--diamond-500);
  --accent-hover: var(--diamond-400);
  --accent-press: var(--diamond-600);
  --accent-elite: var(--gold-400);

  /* glass fills (paired with backdrop-blur in effects.css) */
  --glass-fill:        rgba(180,210,255,0.04);
  --glass-fill-strong: rgba(180,210,255,0.07);
  --glass-fill-bright: rgba(180,210,255,0.10);
}

/* ============================================================
   ANGELECK OS — Typography
   Space Grotesk (display) · Manrope (UI/body) · JetBrains Mono (data)
   ============================================================ */
:root {
  /* ---- Families ---- */
  --font-display: 'Space Grotesk', 'Manrope', system-ui, sans-serif;
  --font-sans:    'Manrope', system-ui, -apple-system, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;

  /* ---- Weights ---- */
  --fw-light:    300; /* @kind font */
  --fw-regular:  400; /* @kind font */
  --fw-medium:   500; /* @kind font */
  --fw-semibold: 600; /* @kind font */
  --fw-bold:     700; /* @kind font */
  --fw-black:    800; /* @kind font */

  /* ---- Type scale (display = Space Grotesk) ---- */
  --text-display-xl: 64px;  /* hero product launch */
  --text-display-l:  48px;
  --text-display-m:  36px;
  --text-h1: 28px;
  --text-h2: 22px;
  --text-h3: 18px;
  --text-body-lg: 16px;
  --text-body:    14px;
  --text-sm:      13px;
  --text-xs:      11px;
  --text-2xs:     9px;     /* micro labels / system readouts */

  /* ---- Line heights ---- */
  --lh-tight:   1.08; /* @kind font */
  --lh-snug:    1.25; /* @kind font */
  --lh-normal:  1.5; /* @kind font */
  --lh-relaxed: 1.65; /* @kind font */

  /* ---- Tracking ---- */
  --ls-tight:  -0.02em; /* @kind font */
  --ls-normal: 0; /* @kind font */
  --ls-wide:   0.06em; /* @kind font */
  --ls-eyebrow: 0.18em; /* @kind font */
}

/* ---- Optional utility classes (semantic helpers) ---- */
.aos-display { font-family: var(--font-display); font-weight: var(--fw-bold); letter-spacing: var(--ls-tight); line-height: var(--lh-tight); color: var(--text-strong); }
.aos-eyebrow { font-family: var(--font-mono); font-size: var(--text-2xs); letter-spacing: var(--ls-eyebrow); text-transform: uppercase; color: var(--text-muted); }
.aos-mono    { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ============================================================
   ANGELECK OS — Spacing, sizing & radii
   4px base grid. Generous, calm, control-center density.
   ============================================================ */
:root {
  --space-0:  0;
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-7:  32px;
  --space-8:  40px;
  --space-9:  48px;
  --space-10: 64px;
  --space-11: 80px;
  --space-12: 112px;

  /* ---- Radii (crystalline, softly faceted) ---- */
  --r-xs:   6px;
  --r-sm:   10px;
  --r-md:   14px;
  --r-lg:   18px;
  --r-xl:   24px;
  --r-2xl:  32px;
  --r-pill: 999px;

  /* ---- Control sizing ---- */
  --control-sm: 32px;
  --control-md: 40px;
  --control-lg: 48px;

  /* ---- Layout ---- */
  --topbar-h:     56px;
  --sidebar-w:    248px;
  --rail-w:       72px;
  --container-max: 1400px;
}

/* ============================================================
   ANGELECK OS — Effects: glass, glow, shadow, motion
   The crystalline / holographic depth lives here.
   ============================================================ */
:root {
  /* ---- Elevation shadows (deep, soft, on black) ---- */
  --shadow-sm:   0 2px 8px rgba(0,0,0,0.45);
  --shadow-md:   0 8px 24px rgba(0,0,0,0.50);
  --shadow-lg:   0 24px 60px -20px rgba(0,0,0,0.75);
  --shadow-xl:   0 40px 100px -30px rgba(0,0,0,0.85);

  /* ---- Diamond glow (accent halos) ---- */
  --glow-diamond:    0 0 24px rgba(77,163,255,0.35);
  --glow-diamond-lg: 0 0 48px rgba(77,163,255,0.45), 0 0 90px rgba(77,163,255,0.18);
  --glow-gold:       0 0 28px rgba(231,205,147,0.40);
  --glow-soft:       0 0 0 1px rgba(150,190,255,0.10), 0 10px 40px -12px rgba(13,40,100,0.6);

  /* ---- Inner crystal highlight (top edge sheen) ---- */
  --sheen-top: inset 0 1px 0 rgba(255,255,255,0.06); /* @kind shadow */
  --sheen-card: inset 0 1px 0 rgba(255,255,255,0.05), inset 0 0 24px rgba(77,163,255,0.04); /* @kind shadow */

  /* ---- Glass blur ---- */
  --blur-sm: 10px; /* @kind other */
  --blur-md: 18px; /* @kind other */
  --blur-lg: 28px; /* @kind other */

  /* ---- Composed glass surface (use as a set) ---- */
  --glass-border: 1px solid var(--border-soft);

  /* ---- Gradients ---- */
  --grad-diamond:  linear-gradient(135deg, #4DA3FF 0%, #2E7BE0 100%); /* @kind color */
  --grad-diamond-soft: linear-gradient(135deg, rgba(77,163,255,0.22), rgba(46,123,224,0.10)); /* @kind color */
  --grad-holo:     linear-gradient(120deg, #4DA3FF 0%, #57E6E0 45%, #8FA0FF 100%); /* @kind color */
  --grad-elite:    linear-gradient(135deg, #F2DDA8 0%, #D4B36A 100%); /* @kind color */
  --grad-stage:    radial-gradient(1200px 700px at 50% -10%, rgba(27,68,136,0.35), transparent 60%), radial-gradient(900px 600px at 100% 110%, rgba(46,123,224,0.16), transparent 55%); /* @kind color */
  --grad-facet:    conic-gradient(from 210deg at 50% 50%, #2E7BE0, #4DA3FF, #9FD2FF, #4DA3FF, #2E7BE0); /* @kind color */

  /* ---- Motion ---- */
  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */
  --ease-inout: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */
  --dur-fast:   140ms; /* @kind other */
  --dur-med:    240ms; /* @kind other */
  --dur-slow:   420ms; /* @kind other */
}

/* ---- Reusable glass surface helper ---- */
.aos-glass {
  background: var(--glass-fill);
  backdrop-filter: blur(var(--blur-md));
  -webkit-backdrop-filter: blur(var(--blur-md));
  border: 1px solid var(--border-soft);
