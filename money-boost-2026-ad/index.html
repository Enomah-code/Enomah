<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Money Boost 2026 — Publicité</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("assets/fonts/Inter-400.ttf") format("truetype");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 600;
        font-display: block;
        src: url("assets/fonts/Inter-600.ttf") format("truetype");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url("assets/fonts/Inter-700.ttf") format("truetype");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 800;
        font-display: block;
        src: url("assets/fonts/Inter-800.ttf") format("truetype");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 900;
        font-display: block;
        src: url("assets/fonts/Inter-900.ttf") format("truetype");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #060A12;
        font-family: "Inter", sans-serif;
      }
      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div

      data-height="1920"

      <div
        id="s1"
        class="scene"
        data-composition-id="s1-hook"

        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-width="1080"
        data-height="1920"

      <div
        id="s2"

        id="s8"
        class="scene"
        data-composition-id="s8-urgency"

        data-start="41"
        data-duration="4"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="s9"
        class="scene"
        data-composition-id="s9-cta"

        data-start="45"
        data-duration="8"
        data-track-index="1"

    <script>

      const mainTl = gsap.timeline({ paused: true });
      window.__timelines["main"] = mainTl;

</html>
