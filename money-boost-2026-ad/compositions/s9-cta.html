    <script src="assets/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const qa = (s) => document.querySelectorAll('[data-composition-id="s9-cta"] ' + s);

        /* Background */
        tl.fromTo('#bg-radial', { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: 'expo.out' }, 0);
        tl.to('#bg-radial', { scale: 1.06, yoyo: true, repeat: 6, duration: 0.9, ease: 'sine.inOut' }, 0.6);
        tl.fromTo('#ring1', { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: 'expo.out' }, 0.05);
        tl.fromTo('#ring2', { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: 'expo.out' }, 0.1);
        tl.to('#ring1', { rotation: 8, yoyo: true, repeat: 5, duration: 1.2, ease: 'sine.inOut' }, 0.8);

        /* Coins */
        qa('.coin').forEach(function(coin, i) {
          tl.fromTo(coin, { opacity: 0, scale: 0, y: -30 }, { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: 'back.out(1.6)' }, 0.2 + i * 0.08);
          tl.to(coin, { y: '-=14', yoyo: true, repeat: 8, duration: 0.7 + i * 0.1, ease: 'sine.inOut' }, 0.6 + i * 0.1);
        });

        /* Content */
        tl.fromTo('#logo', { opacity: 0, y: -30, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(1.6)' }, 0.25);
        tl.fromTo('.gift-label', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0.45);
        tl.fromTo('#headline', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: 'expo.out' }, 0.45);
        tl.fromTo('#subline', { opacity: 0, y: 25 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.8);

        /* CTA button */
        tl.fromTo('#cta-btn', { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: 'back.out(1.8)' }, 1.1);
        tl.to('#cta-btn', { scale: 1.04, yoyo: true, repeat: 10, duration: 0.55, ease: 'sine.inOut' }, 1.7);
        tl.fromTo('#url-note', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power2.out' }, 1.5);

        /* Payments */
        tl.fromTo('#pay-row', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 1.7);

        /* Features */
        tl.fromTo('#feat-mini', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out' }, 2.0);

        /* Brand */
        tl.fromTo('#brand', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 2.3);

        /* Final scene: gentle fade-out hold release at very end */
        tl.to(['.content', '#brand'], { opacity: 1, duration: 0.1 }, 7.0);

        window.__timelines = window.__timelines || {};
        window.__timelines['s9-cta'] = tl;
      })();
    </script>

</template>
