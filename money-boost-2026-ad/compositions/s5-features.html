    <script src="assets/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        tl.fromTo('.bg-glow-top', { scale: 0.9 }, { scale: 1.1, duration: 5, ease: 'sine.inOut', yoyo: true, repeat: 2 }, 0);

        /* Ticker */
        tl.fromTo('#ticker', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: 'expo.out' }, 0.1);
        tl.fromTo('#ticker-inner', { x: 0 }, { x: -1200, duration: 9, ease: 'none' }, 0.3);

        /* Title */
        tl.fromTo('#feat-title', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.3);

        /* Feature cards cascade */
        var cards = ['#fc1','#fc2','#fc3','#fc4','#fc5','#fc6'];
        cards.forEach(function(id, i) {
          tl.fromTo(id,
            { opacity: 0, x: -60 },
            { opacity: 1, x: 0, duration: 0.45, ease: 'expo.out' },
            0.7 + i * 0.28
          );
        });

        /* Counter row */
        tl.fromTo('#counter-row', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 7.5);

        window.__timelines = window.__timelines || {};
        window.__timelines['s5-features'] = tl;
