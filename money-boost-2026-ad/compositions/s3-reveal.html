<template id="s3-reveal-template">
  <div data-composition-id="s3-reveal" data-width="1080" data-height="1920" data-duration="5">

    <style>
      [data-composition-id="s3-reveal"] {
        background: #060A12;
        font-family: "Inter", sans-serif;
        overflow: hidden;
        position: relative;
        width: 1080px;
        height: 1920px;
      }
      [data-composition-id="s3-reveal"] .flash-overlay {
        position: absolute; inset: 0;
        background: #FFC300; opacity: 0; z-index: 10; pointer-events: none;
      }
      [data-composition-id="s3-reveal"] .bg-radial {
        position: absolute;
        width: 1300px; height: 1300px;
        background: radial-gradient(circle, rgba(255,195,0,0.22) 0%, transparent 64%);
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none; opacity: 0;
      }
      [data-composition-id="s3-reveal"] .ring {
        position: absolute; border-radius: 50%;
        border: 2px solid rgba(255,195,0,0.13);
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none; opacity: 0;
      }
      [data-composition-id="s3-reveal"] .ring.r1 { width: 1050px; height: 1050px; }
      [data-composition-id="s3-reveal"] .ring.r2 { width: 1320px; height: 1320px; border-color: rgba(255,195,0,0.07); }
      [data-composition-id="s3-reveal"] .content {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        padding: 60px;
      }
      [data-composition-id="s3-reveal"] .logo {
        width: 230px; height: auto;
        margin-bottom: 18px;
        opacity: 0;
        filter: drop-shadow(0 6px 24px rgba(0,0,0,0.6));
      }
      [data-composition-id="s3-reveal"] .poster-wrap {
        width: 860px; height: 860px;
        border-radius: 28px;
        overflow: hidden;
        border: 3px solid rgba(255,195,0,0.55);
        box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 60px rgba(255,195,0,0.25);
        opacity: 0;
      }
      [data-composition-id="s3-reveal"] .poster-wrap img {
        width: 100%; height: 100%; object-fit: cover; display: block;
      }
      [data-composition-id="s3-reveal"] .kicker {
        margin-top: 30px;
        display: flex; align-items: center; gap: 14px;
        background: rgba(255,195,0,0.12);
        border: 1px solid rgba(255,195,0,0.35);
        border-radius: 14px;
        padding: 16px 34px;
        font-size: 34px; font-weight: 800;
        color: #FFC300; letter-spacing: 0.04em;
        opacity: 0;
      }
      [data-composition-id="s3-reveal"] .grain {
        position: absolute; inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
        opacity: 0.5; pointer-events: none;
      }
    </style>

    <div class="flash-overlay" id="flash"></div>
    <div class="grain"></div>
    <div class="bg-radial" id="bg-radial"></div>
    <div class="ring r1" id="ring1"></div>
    <div class="ring r2" id="ring2"></div>

    <div class="content">
      <img class="logo" id="logo" src="assets/img/emk-logo.png" alt="EMK Blue Diamond" />
      <div class="poster-wrap" id="poster"><img src="assets/img/poster.png" alt="Pack Money Boost 2026" /></div>
      <div class="kicker" id="kicker">⚡ Disponible maintenant</div>
    </div>

    <script src="assets/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        /* Flash hit */
        tl.fromTo('#flash', { opacity: 0 }, { opacity: 0.65, duration: 0.08, ease: 'none' }, 0.05);
        tl.fromTo('#flash', { opacity: 0.65 }, { opacity: 0, duration: 0.32, ease: 'power2.out' }, 0.13);

        /* BG */
        tl.fromTo('#bg-radial', { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.7, ease: 'expo.out' }, 0.05);
        tl.fromTo('#ring1', { opacity: 0, scale: 0.2 }, { opacity: 1, scale: 1, duration: 0.8, ease: 'expo.out' }, 0.08);
        tl.fromTo('#ring2', { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.7, ease: 'expo.out' }, 0.12);
        tl.to('#bg-radial', { scale: 1.06, yoyo: true, repeat: 4, duration: 1.0, ease: 'sine.inOut', overwrite: 'auto' }, 0.9);
        tl.to('#ring1', { rotation: 6, yoyo: true, repeat: 4, duration: 1.2, ease: 'sine.inOut' }, 0.9);

        /* Logo drops in */
        tl.fromTo('#logo', { opacity: 0, y: -40, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: 'back.out(1.6)' }, 0.3);

        /* Poster hero scales in */
        tl.fromTo('#poster', { opacity: 0, scale: 0.6, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: 'back.out(1.4)' }, 0.45);
        tl.to('#poster', { scale: 1.02, yoyo: true, repeat: 3, duration: 1.1, ease: 'sine.inOut', overwrite: 'auto' }, 1.2);

        /* Kicker */
        tl.fromTo('#kicker', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 1.0);
        tl.to('#kicker', { scale: 1.05, yoyo: true, repeat: 4, duration: 0.5, ease: 'sine.inOut', overwrite: 'auto' }, 1.6);

        window.__timelines = window.__timelines || {};
        window.__timelines['s3-reveal'] = tl;
      })();
    </script>
  </div>
</template>
