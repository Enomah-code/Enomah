<template id="s6-results-template">
  <div data-composition-id="s6-results" data-width="1080" data-height="1920" data-duration="7">

    <style>
      [data-composition-id="s6-results"] {
        background: #060A12;
        font-family: "Inter", sans-serif;
        overflow: hidden;
        position: relative;
        width: 1080px;
        height: 1920px;
      }
      [data-composition-id="s6-results"] .bg-glow {
        position: absolute;
        width: 800px; height: 800px;
        background: radial-gradient(circle, rgba(255,195,0,0.12) 0%, transparent 70%);
        bottom: 8%; right: -10%;
        pointer-events: none;
      }
      [data-composition-id="s6-results"] .ghost-up {
        position: absolute;
        font-size: 700px;
        font-weight: 900;
        color: rgba(0,217,126,0.04);
        bottom: -8%;
        left: -40px;
        line-height: 1;
        pointer-events: none;
        user-select: none;
      }
      [data-composition-id="s6-results"] .content {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 80px;
      }
      [data-composition-id="s6-results"] .section-label {
        font-size: 24px;
        font-weight: 700;
        color: #FFC300;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 28px;
        opacity: 0;
      }
      [data-composition-id="s6-results"] .title {
        font-size: 64px;
        font-weight: 900;
        color: #FFFFFF;
        line-height: 1.1;
        letter-spacing: -2px;
        margin-bottom: 72px;
        opacity: 0;
      }
      [data-composition-id="s6-results"] .title span { color: #FFC300; }

      [data-composition-id="s6-results"] .timeline {
        position: relative;
        padding-left: 70px;
      }
      [data-composition-id="s6-results"] .timeline-track {
        position: absolute;
        left: 26px;
        top: 10px;
        bottom: 10px;
        width: 5px;
        background: rgba(255,195,0,0.2);
        border-radius: 3px;
      }
      [data-composition-id="s6-results"] .timeline-fill {
        position: absolute;
        left: 26px;
        top: 10px;
        width: 5px;
        height: 0;
        background: linear-gradient(to bottom, #00D97E, #FFC300);
        border-radius: 3px;
        box-shadow: 0 0 14px rgba(255,195,0,0.5);
      }
      [data-composition-id="s6-results"] .tl-node {
        position: relative;
        margin-bottom: 56px;
        opacity: 0;
      }
      [data-composition-id="s6-results"] .tl-dot {
        position: absolute;
        left: -61px;
        top: 6px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #060A12;
        border: 4px solid #FFC300;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
      }
      [data-composition-id="s6-results"] .tl-period {
        font-size: 28px;
        font-weight: 700;
        color: rgba(255,255,255,0.5);
        letter-spacing: 0.05em;
        margin-bottom: 6px;
      }
      [data-composition-id="s6-results"] .tl-amount {
        font-size: 56px;
        font-weight: 900;
        color: #FFFFFF;
        line-height: 1.05;
      }
      [data-composition-id="s6-results"] .tl-node.gold .tl-amount { color: #FFC300; }
      [data-composition-id="s6-results"] .tl-node.gold .tl-dot {
        border-color: #00D97E;
        background: #00D97E;
        box-shadow: 0 0 24px rgba(0,217,126,0.6);
      }
      [data-composition-id="s6-results"] .tl-amount .unit {
        font-size: 32px;
        font-weight: 700;
        color: rgba(255,255,255,0.5);
      }
      [data-composition-id="s6-results"] .disclaimer {
        position: absolute;
        bottom: 130px;
        left: 80px; right: 80px;
        font-size: 22px;
        font-style: italic;
        font-weight: 400;
        color: rgba(255,255,255,0.4);
        line-height: 1.4;
        opacity: 0;
      }
    </style>

    <div class="bg-glow"></div>
    <div class="ghost-up" data-layout-allow-overflow>↗</div>

    <div class="content">
      <div class="section-label">Tes résultats possibles</div>
      <div class="title">Ce que tu peux<br><span>atteindre :</span></div>

      <div class="timeline">
        <div class="timeline-track"></div>
        <div class="timeline-fill" id="tl-fill"></div>

        <div class="tl-node" id="n1">
          <div class="tl-dot">📍</div>
          <div class="tl-period">Semaine 1</div>
          <div class="tl-amount">5 000 – 15 000 <span class="unit">FCFA</span></div>
        </div>
        <div class="tl-node" id="n2">
          <div class="tl-dot">📍</div>
          <div class="tl-period">Mois 1</div>
          <div class="tl-amount">50 000 – 100 000 <span class="unit">FCFA</span></div>
        </div>
        <div class="tl-node" id="n3">
          <div class="tl-dot">📍</div>
          <div class="tl-period">Mois 3</div>
          <div class="tl-amount">200 000 – 500 000 <span class="unit">FCFA</span></div>
        </div>
        <div class="tl-node gold" id="n4">
          <div class="tl-dot">🏆</div>
          <div class="tl-period">Fin 2026</div>
          <div class="tl-amount">1 000 000 <span class="unit">FCFA</span></div>
        </div>
      </div>
    </div>

    <div class="disclaimer" id="disc">Ces résultats ne sont pas garantis — ils dépendent de ton implication. Mais ils sont réels pour ceux qui passent à l'action.</div>

    <script src="assets/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        tl.fromTo('.bg-glow', { scale: 0.9 }, { scale: 1.12, duration: 6, ease: 'sine.inOut' }, 0);
        tl.fromTo('.ghost-up', { y: 30 }, { y: -20, duration: 6, ease: 'sine.inOut' }, 0);

        tl.fromTo('.section-label', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power2.out' }, 0.1);
        tl.fromTo('.title', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, 0.3);

        /* Timeline fill grows */
        tl.fromTo('#tl-fill', { height: 0 }, { height: 540, duration: 3.4, ease: 'power1.inOut' }, 0.9);

        /* Nodes appear in sync with fill */
        tl.fromTo('#n1', { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: 'back.out(1.4)' }, 1.0);
        tl.fromTo('#n2', { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: 'back.out(1.4)' }, 1.8);
        tl.fromTo('#n3', { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: 'back.out(1.4)' }, 2.6);
        tl.fromTo('#n4', { opacity: 0, x: 40, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.55, ease: 'back.out(1.7)' }, 3.5);

        /* Winner pulse */
        tl.to('#n4 .tl-dot', { scale: 1.15, yoyo: true, repeat: 5, duration: 0.5, ease: 'sine.inOut' }, 4.2);

        tl.fromTo('#disc', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power2.out' }, 4.5);

        window.__timelines = window.__timelines || {};
        window.__timelines['s6-results'] = tl;
      })();
    </script>
  </div>
</template>
