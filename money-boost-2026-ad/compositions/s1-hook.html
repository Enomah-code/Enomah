<template id="s1-hook-template">
  <div data-composition-id="s1-hook" data-width="1080" data-height="1920" data-duration="3">

    <style>
      [data-composition-id="s1-hook"] {
        background: #060A12;
        font-family: "Inter", sans-serif;
        overflow: hidden;
        position: relative;
        width: 1080px;
        height: 1920px;
      }
      /* Background layers */
      [data-composition-id="s1-hook"] .bg-glow-1 {
        position: absolute;
        width: 800px; height: 800px;
        background: radial-gradient(circle, rgba(255,195,0,0.18) 0%, transparent 70%);
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      [data-composition-id="s1-hook"] .bg-glow-2 {
        position: absolute;
        width: 400px; height: 400px;
        background: radial-gradient(circle, rgba(255,210,60,0.12) 0%, transparent 70%);
        top: 30%; left: 20%;
        pointer-events: none;
      }
      [data-composition-id="s1-hook"] .ghost-text {
        position: absolute;
        font-size: 320px;
        font-weight: 900;
        color: rgba(255,195,0,0.05);
        top: 40%;
        left: -60px;
        white-space: nowrap;
        letter-spacing: -10px;
        line-height: 1;
        pointer-events: none;
        user-select: none;
      }
      [data-composition-id="s1-hook"] .hairline-h {
        position: absolute;
        left: 80px; right: 80px;
        height: 2px;
        background: rgba(255,195,0,0.25);
        top: 240px;
      }
      [data-composition-id="s1-hook"] .hairline-h2 {
        position: absolute;
        left: 80px; right: 80px;
        height: 2px;
        background: rgba(255,195,0,0.15);
        bottom: 280px;
      }
      [data-composition-id="s1-hook"] .corner-mark {
        position: absolute;
        width: 40px; height: 40px;
        border-top: 3px solid rgba(255,195,0,0.4);
        border-left: 3px solid rgba(255,195,0,0.4);
      }
      [data-composition-id="s1-hook"] .corner-mark.tr {
        top: 80px; right: 80px;
        border-top: 3px solid rgba(255,195,0,0.4);
        border-left: none;
        border-right: 3px solid rgba(255,195,0,0.4);
      }
      [data-composition-id="s1-hook"] .corner-mark.bl {
        bottom: 80px; left: 80px;
        border-top: none;
        border-left: 3px solid rgba(255,195,0,0.4);
        border-bottom: 3px solid rgba(255,195,0,0.4);
      }
      [data-composition-id="s1-hook"] .corner-mark.br {
        bottom: 80px; right: 80px;
        border-top: none;
        border-left: none;
        border-right: 3px solid rgba(255,195,0,0.4);
        border-bottom: 3px solid rgba(255,195,0,0.4);
      }
      /* Content */
      [data-composition-id="s1-hook"] .content {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 0 90px;
      }
      [data-composition-id="s1-hook"] .label-tag {
        font-size: 26px;
        font-weight: 700;
        color: #FFC300;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-bottom: 48px;
        opacity: 0;
      }
      [data-composition-id="s1-hook"] .hook-line1 {
        font-size: 112px;
        font-weight: 900;
        color: #FFFFFF;
        line-height: 1.0;
        letter-spacing: -3px;
        margin-bottom: 24px;
        opacity: 0;
      }
      [data-composition-id="s1-hook"] .hook-accent {
        color: #FFC300;
      }
      [data-composition-id="s1-hook"] .hook-line2 {
        font-size: 48px;
        font-weight: 600;
        color: rgba(255,255,255,0.75);
        line-height: 1.3;
        max-width: 900px;
        opacity: 0;
      }
      [data-composition-id="s1-hook"] .divider {
        width: 0;
        height: 4px;
        background: #FFC300;
        margin-bottom: 36px;
        border-radius: 2px;
      }
      /* Particle coins */
      [data-composition-id="s1-hook"] .coin {
        position: absolute;
        width: 32px; height: 32px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #FFE066, #FFA500);
        border: 2px solid rgba(255,210,0,0.8);
        box-shadow: 0 0 12px rgba(255,195,0,0.5);
        opacity: 0;
      }
    </style>

    <!-- BG Layers -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
    <div class="ghost-text" data-layout-allow-overflow>₣CFA</div>
    <div class="hairline-h"></div>
    <div class="hairline-h2"></div>
    <div class="corner-mark" style="top:80px;left:80px;"></div>
    <div class="corner-mark tr"></div>
    <div class="corner-mark bl"></div>
    <div class="corner-mark br"></div>

    <!-- Coins scattered -->
    <div class="coin" id="coin1" style="top:15%;left:80%;"></div>
    <div class="coin" id="coin2" style="top:25%;left:10%;"></div>
    <div class="coin" id="coin3" style="top:75%;left:85%;"></div>
    <div class="coin" id="coin4" style="top:80%;left:12%;"></div>
    <div class="coin" id="coin5" style="top:10%;left:50%;"></div>
    <div class="coin" id="coin6" style="top:60%;left:5%;"></div>

    <!-- Content -->
    <div class="content">
      <div class="label-tag">Emk Blue Diamond</div>
      <div class="divider" id="divider1"></div>
      <div class="hook-line1">Tu veux<br>de <span class="hook-accent">l'argent ?</span></div>
      <div class="hook-line2">Voici exactement<br>comment en gagner.</div>
    </div>

    <script src="assets/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        const q = (s) => document.querySelector('[data-composition-id="s1-hook"] ' + s);
        const qa = (s) => document.querySelectorAll('[data-composition-id="s1-hook"] ' + s);

        /* ── Background pulse ── */
        tl.fromTo('.bg-glow-1', { scale: 0.9 }, { scale: 1.05, duration: 2.5, ease: 'sine.inOut', yoyo: true, repeat: 2 }, 0);
        tl.fromTo('.bg-glow-2', { scale: 1.1 }, { scale: 0.88, duration: 1.8, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0.3);

        /* ── Hairlines ── */
        tl.fromTo('.hairline-h',  { scaleX: 0, transformOrigin: 'left' }, { scaleX: 1, duration: 0.6, ease: 'power3.out' }, 0.1);
        tl.fromTo('.hairline-h2', { scaleX: 0, transformOrigin: 'right' }, { scaleX: 1, duration: 0.6, ease: 'power3.out' }, 0.2);

        /* ── Label ── */
        tl.fromTo('.label-tag', { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0.2);

        /* ── Divider sweep ── */
        tl.fromTo('#divider1', { width: 0 }, { width: 120, duration: 0.5, ease: 'expo.out' }, 0.4);

        /* ── Headline ── */
        tl.fromTo('.hook-line1', { opacity: 0, y: 60, skewY: 2 }, { opacity: 1, y: 0, skewY: 0, duration: 0.55, ease: 'expo.out' }, 0.45);

        /* ── Subtitle ── */
        tl.fromTo('.hook-line2', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.75);

        /* ── Coins scatter in ── */
        qa('.coin').forEach(function(coin, i) {
          tl.fromTo(coin,
            { opacity: 0, scale: 0, y: -40 },
            { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: 'back.out(1.6)' },
            0.3 + i * 0.08
          );
          tl.to(coin, { y: '-=15', yoyo: true, repeat: 8, duration: 0.5 + i * 0.07, ease: 'sine.inOut' }, 0.5 + i * 0.1);
        });

        /* ── Ghost text drift ── */
        tl.fromTo('.ghost-text', { x: -30 }, { x: 30, duration: 2.8, ease: 'sine.inOut' }, 0);

        window.__timelines = window.__timelines || {};
        window.__timelines['s1-hook'] = tl;
      })();
    </script>
  </div>
</template>
