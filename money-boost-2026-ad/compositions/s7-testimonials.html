    <script src="assets/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        tl.fromTo('.bg-glow', { scale: 0.9 }, { scale: 1.1, duration: 5.5, ease: 'sine.inOut' }, 0);
        tl.fromTo('.ghost-quote', { y: -20 }, { y: 20, duration: 5.5, ease: 'sine.inOut' }, 0);

        tl.fromTo('.section-label', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power2.out' }, 0.1);
        tl.fromTo('.title', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, 0.3);

        tl.fromTo('#card1', { opacity: 0, x: -50, scale: 0.95 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: 'back.out(1.3)' }, 0.8);
        tl.fromTo('#card2', { opacity: 0, x:  50, scale: 0.95 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: 'back.out(1.3)' }, 1.5);
        tl.fromTo('#card3', { opacity: 0, x: -50, scale: 0.95 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: 'back.out(1.3)' }, 2.2);

        /* subtle float on cards */
        tl.to('#card1', { y: -8, yoyo: true, repeat: 4, duration: 0.9, ease: 'sine.inOut' }, 2.8);
        tl.to('#card3', { y: -8, yoyo: true, repeat: 4, duration: 1.1, ease: 'sine.inOut' }, 3.0);

        window.__timelines = window.__timelines || {};
        window.__timelines['s7-testimonials'] = tl;
