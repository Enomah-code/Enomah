      [data-composition-id="s7-testimonials"] .section-label {

      [data-composition-id="s7-testimonials"] .card img {

    <script src="assets/gsap.min.js"></script>
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });

        tl.fromTo('.bg-glow', { scale: 0.9 }, { scale: 1.1, duration: 6.5, ease: 'sine.inOut' }, 0);
        tl.fromTo('.ghost-quote', { y: -20 }, { y: 20, duration: 6.5, ease: 'sine.inOut' }, 0);

        tl.fromTo('.section-label', { opacity: 0, y: -15 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, 0.1);
        tl.fromTo('.title', { opacity: 0, y: 25 }, { opacity: 1, y: 0, duration: 0.5, ease: 'expo.out' }, 0.25);

        /* Cards cascade in (preserve rotation via fromTo) */
        tl.fromTo('#card1', { opacity: 0, x: -70, rotation: -10 }, { opacity: 1, x: 0, rotation: -2,   duration: 0.5, ease: 'back.out(1.3)' }, 0.7);
        tl.fromTo('#card2', { opacity: 0, x:  70, rotation: 10 },  { opacity: 1, x: 0, rotation: 2.5,  duration: 0.5, ease: 'back.out(1.3)' }, 1.15);
        tl.fromTo('#card3', { opacity: 0, x: -70, rotation: -10 }, { opacity: 1, x: 0, rotation: -1.5, duration: 0.5, ease: 'back.out(1.3)' }, 1.6);

        /* gentle float */
        tl.to('#card2', { y: -8, yoyo: true, repeat: 4, duration: 1.0, ease: 'sine.inOut' }, 2.4);

        tl.fromTo('#trust', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 2.3);

        window.__timelines = window.__timelines || {};
        window.__timelines['s7-testimonials'] = tl;
      })();
