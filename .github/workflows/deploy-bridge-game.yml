name: Déployer Architecte de Ponts (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "bridge-game/**"
      - ".github/workflows/deploy-bridge-game.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge-game/package-lock.json

      - name: Install dependencies
        working-directory: bridge-game
        run: npm ci

      - name: Typecheck & build
        working-directory: bridge-game
        run: npm run build
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/bridge-game/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: bridge-game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
